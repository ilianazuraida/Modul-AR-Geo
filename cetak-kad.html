<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>7 Kad AR-Geo A5 untuk Dicetak</title><link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&amp;display=swap" rel="stylesheet"/><style>@page{size:A5 portrait;margin:0}*{box-sizing:border-box}body{margin:0;font-family:'Mali',sans-serif;color:#305c4e;background:#eee}.toolbar{position:sticky;top:0;background:white;padding:12px;text-align:center;z-index:2}.toolbar button{padding:10px 20px;border-radius:12px;background:#dff3e7;border:1px solid #9bbda7;font:700 15px 'Mali',sans-serif;cursor:pointer}.print-card{width:148mm;height:210mm;margin:12px auto;padding:10mm 10mm 8mm;page-break-after:always;break-after:page;background:linear-gradient(160deg,var(--tint),#fff 70%);border:6mm solid var(--tint);display:flex;align-items:center;flex-direction:column;overflow:hidden}.heading{text-align:center;width:100%}.badge{display:inline-block;background:var(--accent);color:white;padding:5px 17px;border-radius:30px}.heading h1{font-size:23px;line-height:1.25;margin:10px 0}.heading small{font-size:17px;display:block}.shape .shape-art{width:140px;height:115px}.marker{width:91mm;height:91mm;background:white;padding:7mm;border-radius:5mm;border:1.2mm solid #d9e6df;display:flex;align-items:center;justify-content:center}.marker img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}.footer{display:flex;gap:10px;align-items:center;width:100%;margin-top:10px}.footer img{width:32%;height:60px;object-fit:cover;border-radius:12px}.footer p{font-size:11px;line-height:1.45}.facts{font-size:12px;text-align:center;margin-top:auto;font-weight:bold}@media print{body{background:white}.toolbar{display:none}.print-card{margin:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}}@media screen{.print-card{box-shadow:0 5px 25px #0002}} </style><style>
.print-card{padding:0;border:0;background:white;display:block;overflow:hidden}
.print-card .full-art{display:block;width:100%;height:100%;object-fit:fill}.print-card{position:relative}.print-marker{position:absolute;display:block;object-fit:fill;image-rendering:pixelated}
@media print{.print-card{width:148mm;height:210mm;margin:0;page-break-after:always;break-after:page}}
</style></head><body><div class="toolbar">Kad Penanda AR-Geo — cetak pada saiz A5, skala 100%   <button onclick="window.print()">🖨️ Cetak</button></div><section class="print-card" data-shape="cube" style="--tint:#DDF2FF;--accent:#348BCC"><img alt="Kad penanda AR-Geo cube" class="full-art" src="kad-watercolor/cube.png"/></section><section class="print-card" data-shape="cuboid" style="--tint:#FFF0DF;--accent:#D98A41"><img alt="Kad penanda AR-Geo cuboid" class="full-art" src="kad-watercolor/cuboid.png"/></section><section class="print-card" data-shape="prism" style="--tint:#E6F6E6;--accent:#5C9C69"><img alt="Kad penanda AR-Geo prism" class="full-art" src="kad-watercolor/prism.png"/></section><section class="print-card" data-shape="pyramid" style="--tint:#FFE8F0;--accent:#CB7093"><img alt="Kad penanda AR-Geo pyramid" class="full-art" src="kad-watercolor/pyramid.png"/></section><section class="print-card" data-shape="cylinder" style="--tint:#F0E8FF;--accent:#9471C1"><img alt="Kad penanda AR-Geo cylinder" class="full-art" src="kad-watercolor/cylinder.png"/></section><section class="print-card" data-shape="cone" style="--tint:#FFF5D9;--accent:#D8A43B"><img alt="Kad penanda AR-Geo cone" class="full-art" src="kad-watercolor/cone.png"/></section><section class="print-card" data-shape="sphere" style="--tint:#E0F6FA;--accent:#4CABC3"><img alt="Kad penanda AR-Geo sphere" class="full-art" src="kad-watercolor/sphere.png"/></section><script>const id=new URLSearchParams(location.search).get('bentuk');if(id){document.querySelectorAll('.print-card').forEach(e=>{if(e.dataset.shape!==id)e.remove()})}</script></body></html>
