<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>AR Pentag​on — Marker Hiro</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script><style>body{margin:0;overflow:hidden;font-family:system-ui}#guide{position:fixed;top:8px;left:8px;right:8px;z-index:1000;background:#fff9e9eb;color:#432e5e;border-radius:14px;padding:10px;text-align:center;font-size:14px}#back{position:fixed;bottom:15px;left:15px;z-index:1000;background:#7349a2;color:white;border:0;border-radius:12px;padding:12px;text-decoration:none}#status{font-weight:bold}</style></head><body><div id="guide"><b>🔎 Imbas kad marker Hiro</b><div id="status">Halakan kamera pada marker untuk melihat segi lima AR.</div><small>Jika kamera tidak muncul, buka melalui HTTPS dan benarkan akses kamera.</small></div><a id="back" href="detektif-cabaran-1.html">← Kembali ke cabaran</a><a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;precision:medium" arjs="sourceType:webcam;debugUIEnabled:false;trackingMethod:best;" ><a-marker preset="hiro" id="hiro"><a-entity position="0 0.1 0" rotation="-90 0 0"><a-circle radius="0.6" segments="5" color="#a865da" material="side:double;opacity:0.85;transparent:true"></a-circle><a-ring radius-inner="0.58" radius-outer="0.64" segments-theta="5" color="#ffcc57" material="side:double"></a-ring></a-entity><a-text value="SEGI LIMA" color="#35224c" position="-0.55 0.45 0" rotation="-90 0 0" width="2.4"></a-text></a-marker><a-entity camera></a-entity></a-scene><script>const m=document.getElementById('hiro'),s=document.getElementById('status');m.addEventListener('markerFound',()=>s.textContent='Marker dikesan! Perhatikan bentuk dan kira sisi serta bucu.');m.addEventListener('markerLost',()=>s.textContent='Marker tidak kelihatan. Halakan kamera semula pada kad Hiro.');</script></body></html>
