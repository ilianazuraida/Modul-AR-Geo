<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabaran 1 — Bilik Misteri Poligon</title><style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#d5b6db;color:#48314b;font-family:'Comic Neue','Comic Sans MS',system-ui,sans-serif}button,a{font:inherit}.game{min-height:100vh;max-width:1650px;margin:auto;padding:8px;background:#ead8ea}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 auto 7px;max-width:1500px}.pill{background:#fff6e9;border:2px solid #986e9b;border-radius:16px;padding:7px 13px;font-weight:700}.top a{color:#5b3e66;text-decoration:none}.room{position:relative;margin:auto;width:min(100%,1500px);aspect-ratio:16/9;background:url('bilik-misteri-poligon-watercolor.png') center/100% 100% no-repeat;border:4px solid #ae84ae;border-radius:18px;box-shadow:0 9px 28px #54365b55;overflow:hidden}.obj{position:absolute;cursor:pointer;border:2px solid transparent;border-radius:16px;background:transparent;color:transparent;font-size:0;transition:background .15s,box-shadow .15s}.obj:hover,.obj:focus-visible{background:#fff4a326;box-shadow:inset 0 0 0 3px #fff6b9;outline:2px dashed #ffef98}.book{left:39%;top:69%;width:20%;height:19%}.painting{left:69%;top:15%;width:16%;height:29%}.drawer{left:63%;top:65%;width:19%;height:16%}.chest{left:66%;top:44%;width:16%;height:20%}.marker{left:75%;top:83%;width:14%;height:15%}.door{left:85%;top:16%;width:14%;height:57%}.status{max-width:1500px;margin:9px auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.status .pill{font-size:14px}.message{background:#fff8e8;border:2px solid #ba90bd;border-radius:17px;padding:12px;max-width:1500px;margin:8px auto;line-height:1.45}.message strong{color:#744a8a}.modal{position:fixed;inset:0;background:#23142bbb;display:none;align-items:center;justify-content:center;z-index:5;padding:18px}.modal.show{display:flex}.card{position:relative;background:#fff8e7;border:5px solid #b78db6;border-radius:25px;padding:23px;max-width:550px;width:100%;box-shadow:0 16px 40px #0005;text-align:center}.card h2{margin:0 0 10px;color:#704e86}.card p{line-height:1.5}.close{position:absolute;right:12px;top:8px;background:transparent;border:0;font-size:28px;cursor:pointer}.btn{display:inline-block;border:0;background:#7d57a4;color:white;padding:12px 18px;border-radius:14px;font-weight:700;cursor:pointer;text-decoration:none;margin:5px}.btn.secondary{background:#b6773d}.symbols{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:15px}.symbols button{font-size:40px;border:3px solid #b99bca;background:#fff;border-radius:16px;padding:9px 16px;cursor:pointer}.symbols button:hover{background:#e7d6f4}.digits{font-size:44px;letter-spacing:8px;color:#74518b;font-weight:700}.note{font-size:13px;color:#66546c}@media(max-width:650px){.game{padding:4px}.room{border-width:2px;border-radius:9px}.pill{padding:6px 9px}.card{padding:16px}.message{font-size:14px}}
</style></head><body><main class="game"><div class="top"><div class="pill">🔎 DETEKTIF KOD POLIGON · BILIK 1</div><a class="pill" href="detektif-kod-poligon.html">↩ Kembali</a></div><div class="room" aria-label="Bilik misteri interaktif dengan enam kawasan boleh diklik"><button class="obj book" onclick="inspect('book')" aria-label="Periksa buku">Buku</button><button class="obj painting" onclick="inspect('painting')" aria-label="Periksa lukisan">Lukisan</button><button class="obj drawer" onclick="inspect('drawer')" aria-label="Periksa laci">Laci</button><button class="obj chest" onclick="inspect('chest')" aria-label="Periksa peti">Peti</button><button class="obj marker" onclick="inspect('marker')" aria-label="Imbas marker AR">Marker AR</button><button class="obj door" onclick="inspect('door')" aria-label="Periksa pintu rahsia">Pintu</button></div><div class="status"><div class="pill" id="progress">Petunjuk: 0/3</div><div class="pill" id="arstate">AR: Belum diteroka</div><div class="pill" id="unlock">Pintu: Terkunci</div></div><div class="message" id="message"><strong>Comel:</strong> Kita terperangkap dalam bilik misteri! Cari tiga petunjuk, imbas kad AR dan selesaikan roda simbol untuk membuka pintu. Klik objek di dalam bilik.</div></main><div class="modal" id="modal"><div class="card"><button class="close" onclick="closeModal()" aria-label="Tutup">×</button><h2 id="mt"></h2><div id="mb"></div></div></div><script>
const clues=new Set(JSON.parse(sessionStorage.getItem('dkp_clues')||'[]'));let solved=sessionStorage.getItem('dkp_solved')==='yes';let arSeen=sessionStorage.getItem('dkp_ar')==='yes';function save(){sessionStorage.setItem('dkp_clues',JSON.stringify([...clues]));sessionStorage.setItem('dkp_solved',solved?'yes':'no');sessionStorage.setItem('dkp_ar',arSeen?'yes':'no');refresh()}function refresh(){document.getElementById('progress').textContent='Petunjuk: '+clues.size+'/3';document.getElementById('arstate').textContent='AR: '+(arSeen?'Telah dibuka':'Belum diteroka');document.getElementById('unlock').textContent='Pintu: '+(solved?'Terbuka':'Terkunci')}function modal(t,b){document.getElementById('mt').textContent=t;document.getElementById('mb').innerHTML=b;document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show')}function clue(id){clues.add(id);save()}function inspect(x){if(x==='book'){clue('book');modal('📚 Buku Penyiasat','<p>Nota Aina: “Bentuk sasaran mempunyai <b>lima sisi lurus</b>.”</p><p class="note">Petunjuk 1/3 dijumpai.</p>')}if(x==='painting'){clue('painting');modal('🖼️ Lukisan Berdebu','<p>Di belakang lukisan tertulis: “Bilangannya <b>lima bucu</b>.”</p><p class="note">Petunjuk 2/3 dijumpai.</p>')}if(x==='drawer'){clue('drawer');modal('🗄️ Laci Terkunci','<p>Kamu menjumpai nota: “Poligon sasaran ialah <b>segi lima</b>. Cari kad misteri untuk melihatnya melalui AR.”</p><p class="note">Petunjuk 3/3 dijumpai.</p>')}if(x==='marker'){modal('🃏 Kad Misteri AR','<p>Imbas kad Hiro untuk melihat poligon segi lima muncul dalam kamera. Gunakan kad bercetak atau paparan pada peranti kedua.</p><a class="btn" href="detektif-marker-hiro.html" target="_blank" rel="noopener">Lihat / cetak marker</a><a class="btn" href="detektif-ar-pentagon.html" target="_blank" rel="noopener" onclick="arOpened()">📷 Buka kamera AR</a><p class="note">Kembali ke bilik ini selepas penerokaan. Butang kamera memerlukan HTTPS dan kebenaran kamera.</p>')}if(x==='chest'){modal('🧰 Peti Petunjuk',solved?'<p>🎉 Kod poligon pertama telah ditemui!</p><div class="digits">⬠</div>':'<p>Peti ini hanya boleh dibuka selepas pintu rahsia berjaya dibuka. Periksa semua objek dahulu.</p>')}if(x==='door'){if(solved){modal('🎉 Pintu Rahsia Terbuka!','<p>Syabas detektif! Kamu memperoleh kod poligon pertama.</p><div class="digits">⬠</div><p><a class="btn" href="detektif-cabaran-2.html">Masuk Cabaran 2 →</a></p>');return}if(clues.size<3){modal('🔒 Pintu Berkunci','<p>Belum cukup petunjuk! Cari buku, lukisan dan laci dahulu.</p>');return}modal('🔐 Roda Simbol Poligon','<p>Gunakan petunjuk yang dijumpai dan pemerhatian AR. Pilih poligon yang mempunyai <b>5 sisi dan 5 bucu</b>.</p><div class="symbols"><button onclick="answer(3)" aria-label="Segi tiga">△</button><button onclick="answer(5)" aria-label="Segi lima">⬠</button><button onclick="answer(6)" aria-label="Segi enam">⬡</button></div><p id="feedback" class="note">Cari bentuk yang tepat untuk membuka kunci.</p>')}}function arOpened(){arSeen=true;save()}function answer(n){if(n===5){solved=true;save();modal('✨ Kunci Berjaya Dibuka!','<p>Hebat! Poligon itu ialah <b>segi lima</b> dengan lima sisi dan lima bucu.</p><div class="digits">⬠</div><p>Kod poligon pertama kod rahsia berjaya diperoleh!</p><a class="btn" href="detektif-cabaran-2.html">Teruskan ke Cabaran 2 →</a>')}else{document.getElementById('feedback').textContent='Belum tepat! Periksa semula bilangan sisi dan bucu.'}}refresh();</script></body></html>
