<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabaran 4 — Menara Jam Poligon Ajaib</title><style>
@import url('https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap');*{box-sizing:border-box}body{margin:0;background:#ddc4e7;color:#463054;font-family:'Comic Neue','Comic Sans MS',cursive;font-weight:700}header{display:flex;justify-content:space-between;align-items:center;background:#fff3de;padding:10px 18px}a{color:#754b9c}.stage{width:min(100%,1280px);aspect-ratio:16/9;position:relative;margin:10px auto;background:url('detektif-cabaran-4-menara.jpg') center/100% 100% no-repeat;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px #705a8055}.hit{position:absolute;border:0;background:transparent;cursor:pointer;touch-action:manipulation}.hit:focus-visible{outline:3px solid #ffeb80}.gear1{left:25%;top:43%;width:9%;height:18%}.gear2{left:32%;top:40%;width:11%;height:22%}.gear3{left:61%;top:41%;width:10%;height:19%}.clock{left:40%;top:26%;width:25%;height:40%}.oct{left:77%;top:45%;width:20%;height:28%}.status{max-width:950px;margin:10px auto;padding:12px;border:3px solid #a783bd;background:#fff6e8;border-radius:18px;text-align:center}.overlay{position:fixed;inset:0;z-index:100;background:#2b1b3ac9;display:none;align-items:center;justify-content:center;padding:14px}.overlay.on{display:flex}.dialog{background:#fff5e1;border:5px solid #a77cbe;border-radius:22px;padding:22px;width:min(750px,100%);max-height:92vh;overflow:auto;text-align:center}.dialog h2{margin:4px 0 12px}.x{float:right;background:none;border:0;font-size:27px;cursor:pointer}.btn{background:#8d5eb4;color:white;border:2px solid #e8c4f0;border-radius:15px;padding:11px 18px;font:inherit;font-weight:700;cursor:pointer;margin:5px}.gears,.sockets,.options{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:16px auto}.gear{width:88px;height:88px;background:#f7d890;border:3px solid #b68d3e;border-radius:50%;display:grid;place-items:center;cursor:grab;touch-action:none;user-select:none;font-size:29px}.gear.found{background:#d5baf0}.socket{width:98px;height:98px;border:3px dashed #a989ba;background:#efe1f3;border-radius:50%;display:grid;place-items:center;font-size:16px}.socket.filled{border:3px solid #6da47d;background:#d6efd9}.dragGhost{position:fixed;pointer-events:none;z-index:1000;transform:translate(-50%,-50%);opacity:.9}.choice{width:100px;height:110px;border:3px solid #a77fba;background:#f8e8fd;border-radius:18px;cursor:pointer;display:grid;place-items:center;font:inherit}.choice svg{width:78px;height:78px}.choice:hover{background:#e9c9f6}.small{font-size:15px;color:#725e7e}.reward svg{width:120px;height:120px}@media(max-width:550px){.gear{width:64px;height:64px}.socket{width:72px;height:72px}.dialog{padding:12px}.choice{width:80px;height:90px}}

/* Full-width responsive stage, keeping the original 16:9 artwork proportions. */
html,body{width:100%;min-height:100%;overflow-x:hidden}
header{position:relative;z-index:3;padding:7px 14px}
main{width:100%;margin:0;padding:0}
.stage{width:100%;max-width:none;margin:0 auto;aspect-ratio:16/9;border-radius:0;box-shadow:none;background-size:100% 100%}
.status{position:fixed;z-index:4;bottom:8px;left:50%;transform:translateX(-50%);width:min(92%,900px);max-width:none;margin:0;padding:8px 12px;background:#fff6e8ef;box-shadow:0 2px 10px #4d315a55}
@media (min-aspect-ratio: 16/9){.stage{width:min(100vw,calc((100dvh - 32px)*16/9));}}
@media(max-width:650px){header{font-size:13px}.status{font-size:12px;padding:5px}}
</style></head><body><header><b>🔎 Detektif Kod Poligon · Cabaran 4</b><a href="detektif-cabaran-3.html">← Galeri 3</a></header><main><div class="stage"><button class="hit gear1" aria-label="Cari gear pertama" onclick="findGear(0)"></button><button class="hit gear2" aria-label="Cari gear kedua" onclick="findGear(1)"></button><button class="hit gear3" aria-label="Cari gear ketiga" onclick="findGear(2)"></button><button class="hit clock" aria-label="Periksa mesin jam" onclick="clock()"></button><button class="hit oct" aria-label="Periksa simbol di kubah" onclick="clock()"></button></div><div class="status" id="status" role="status"></div></main><div class="overlay" id="overlay"><div class="dialog"><button class="x" aria-label="Tutup" onclick="closeDialog()">×</button><div id="content"></div></div></div><script>
const $=id=>document.getElementById(id);let found=new Set(JSON.parse(sessionStorage.getItem('dkp4_found')||'[]')),installed=new Set(JSON.parse(sessionStorage.getItem('dkp4_installed')||'[]')),won=sessionStorage.getItem('dkp4_won')==='yes';let selected=null,drag=null;
function openDialog(h){$('content').innerHTML=h;$('overlay').classList.add('on')}function closeDialog(){$('overlay').classList.remove('on')}
function status(){ $('status').textContent=won?'🎉 Jam ajaib aktif! Kod keempat: OKTAGON':installed.size===3?'✓ Semua gear dipasang! Klik jam untuk tugasan akhir.':found.size===3?'✓ Gear lengkap! Klik jam untuk memasang gear.':'Cari tiga gear tersembunyi di sekitar jam. Gear ditemui: '+found.size+'/3';}
function intro(){openDialog('<h2>🕰️ Menara Jam Poligon Ajaib</h2><p>Cari tiga gear di sekeliling jam. Kemudian pasangkan gear pada mesin dan selesaikan teka-teki oktagon!</p><button class="btn" onclick="closeDialog()">Jom siasat!</button>')}
function findGear(i){if(found.has(i)){openDialog('<h2>✓ Gear '+(i+1)+' sudah ditemui!</h2><p>Cari gear yang lain atau klik jam untuk memasangnya.</p>');return}let qs=[['Poligon yang mempunyai 5 sisi lurus dinamakan…','Pentagon','Heksagon','Oktagon'],['Heksagon mempunyai berapa bucu?','6','7','8'],['Heptagon mempunyai berapa sisi lurus?','7','6','8']];let q=qs[i];openDialog('<h2>⚙️ Gear '+(i+1)+'</h2><p>'+q[0]+'</p>'+q.slice(1).map((x,j)=>'<button class="btn" onclick="gearAnswer('+i+','+j+')">'+x+'</button>').join('')+'<p id="feedback" role="status"></p>')}
function gearAnswer(i,j){if(j!==0){$('feedback').textContent='Cuba lagi. Perhatikan ciri poligon!';return}found.add(i);sessionStorage.setItem('dkp4_found',JSON.stringify([...found]));status();openDialog('<h2>🎉 Gear '+(i+1)+' ditemui!</h2><p>'+found.size+'/3 gear telah dikumpulkan.</p><button class="btn" onclick="closeDialog()">Teruskan</button>')}
function clock(){if(won){reward();return}if(found.size<3){openDialog('<h2>🔒 Mesin Jam Belum Sedia</h2><p>Cari semua tiga gear dahulu ('+found.size+'/3).</p>');return}if(installed.size<3){install();return}finalQuestion()}
function install(){openDialog('<h2>⚙️ Baiki Mesin Jam</h2><p>Seret gear ke ruang mengikut nama poligon. Susunan gear telah diacak.</p><div class="sockets" id="sockets">'+['Pentagon','Heksagon','Heptagon'].map((x,i)=>'<div class="socket '+(installed.has(i)?'filled':'')+'" data-socket="'+i+'">'+(installed.has(i)?'✓':x)+'</div>').join('')+'</div><div class="gears" id="gears">'+[2,0,1].filter(i=>!installed.has(i)).map(i=>'<div class="gear found" data-gear="'+i+'" role="button" tabindex="0" aria-label="Gear '+['Pentagon','Heksagon','Heptagon'][i]+'">⚙️<span class="small">'+[5,6,7][i]+'</span></div>').join('')+'</div><p id="feedback" role="status">Seret gear ke ruang yang sepadan. Alternatif: sentuh gear, kemudian ruang.</p>');document.querySelectorAll('.gear').forEach(el=>{el.addEventListener('pointerdown',down);el.addEventListener('keydown',e=>{if(e.key==='Enter'){selected=+el.dataset.gear;$('feedback').textContent='Sekarang pilih ruang gear.'}})});document.querySelectorAll('.socket').forEach(el=>el.addEventListener('click',()=>{if(selected!==null){place(selected,+el.dataset.socket);selected=null}}))}
function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;let el=e.currentTarget;selected=+el.dataset.gear;let g=el.cloneNode(true);g.classList.add('dragGhost');document.body.appendChild(g);drag={id:selected,ghost:g,pointerId:e.pointerId,x:e.clientX,y:e.clientY};move(e);e.preventDefault()}
function move(e){if(drag&&drag.pointerId===e.pointerId){drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}}
function up(e){if(!drag||drag.pointerId!==e.pointerId)return;let {id,ghost,x,y}=drag;ghost.remove();drag=null;if(Math.hypot(e.clientX-x,e.clientY-y)<8)return;let s=[...document.querySelectorAll('.socket')].find(el=>{let r=el.getBoundingClientRect();let pad=22;return e.clientX>=r.left-pad&&e.clientX<=r.right+pad&&e.clientY>=r.top-pad&&e.clientY<=r.bottom+pad});if(s){place(id,+s.dataset.socket);selected=null}else $('feedback').textContent='Lepaskan gear di ruang bulat yang betul.'}
function place(i,j){if(i!==j){$('feedback').textContent='Belum tepat. Padankan bilangan sisi lurus dengan nama poligon.';return}installed.add(i);sessionStorage.setItem('dkp4_installed',JSON.stringify([...installed]));status();if(installed.size===3)openDialog('<h2>✨ Mesin Jam Berfungsi!</h2><p>Semua gear telah dipasang. Klik jam untuk memilih simbol rahsia.</p><button class="btn" onclick="finalQuestion()">Aktifkan jam!</button>');else install()}
function poly(n){let pts=Array.from({length:n},(_,i)=>{let a=2*Math.PI*i/n-Math.PI/2;return (50+40*Math.cos(a))+','+(50+40*Math.sin(a))}).join(' ');return '<svg viewBox="0 0 100 100"><polygon points="'+pts+'" fill="#e7c5f3" stroke="#8e58b0" stroke-width="4"/></svg>'}
function finalQuestion(){openDialog('<h2>🕰️ Aktifkan Jam Rahsia!</h2><p>Pilih poligon yang mempunyai <b>8 sisi lurus dan 8 bucu</b>.</p><div class="options">'+[6,8,7].map(n=>'<button class="choice" onclick="choose('+n+')" aria-label="Poligon '+n+' sisi">'+poly(n)+'<span>'+n+' sisi</span></button>').join('')+'</div><p id="feedback" role="status"></p>')}
function choose(n){if(n!==8){$('feedback').textContent='Belum tepat. Kira sisi lurus dan bucu sekali lagi.';return}won=true;sessionStorage.setItem('dkp4_won','yes');status();reward()}
function reward(){openDialog('<div class="reward"><h2>🎉 Kod Keempat Ditemui!</h2>'+poly(8)+'<h2>OKTAGON</h2><p>8 sisi lurus dan 8 bucu.</p><p>Kod terkumpul: Pentagon → Heksagon → Heptagon → <b>Oktagon</b></p><button class="btn" onclick="closeDialog()">Simpan kod ✓</button><a class="btn" style="display:inline-block;text-decoration:none" href="detektif-cabaran-5.html">Terus ke Cabaran 5 →</a></div>')}
window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',()=>{if(drag){drag.ghost.remove();drag=null}});status();
</script></body></html>
