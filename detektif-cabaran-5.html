<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cabaran 5 · Teroka Gua Poligon</title><style>
*{box-sizing:border-box}body{margin:0;background:#39294c;color:#fff;font-family:'Comic Sans MS','Trebuchet MS',cursive}header{height:38px;background:#fff1d9;color:#58346b;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:14px}a{color:#7e4ca1}main{position:relative;width:min(100vw,calc((100dvh - 38px)*1.77778));aspect-ratio:16/9;margin:auto;background:url('detektif-cabaran-5-gua-watercolor.png') center/100% 100% no-repeat;overflow:hidden}.hot{position:absolute;background:transparent;border:0;cursor:pointer;touch-action:manipulation}.hot:focus-visible{outline:3px solid #ffe17d;border-radius:50%}.gem1{left:40%;top:54%;width:11%;height:17%}.gem2{left:55%;top:43%;width:11%;height:19%}.gem3{left:62%;top:66%;width:13%;height:19%}.gem4{left:78%;top:57%;width:13%;height:18%}.door{left:76%;top:20%;width:20%;height:39%}.gone{display:none}.progress{position:absolute;left:2%;bottom:2%;font-size:clamp(10px,1.2vw,18px);background:#322143e8;border:2px solid #f6d9a5;border-radius:30px;padding:5px 12px}.overlay{position:fixed;inset:0;background:#1b1229bd;display:none;align-items:center;justify-content:center;padding:12px;z-index:10}.overlay.on{display:flex}.panel{background:#fff3d9;color:#543366;border:5px solid #a979c6;border-radius:22px;width:min(760px,96vw);padding:18px;text-align:center;max-height:92dvh;overflow:auto;box-shadow:0 8px 40px #110d1e}h2{margin:5px 0 10px}.slots,.tiles{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:16px auto}.slot{width:110px;height:110px;border:3px dashed #a77dbd;background:#f4e5f5;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center}.slot.filled{background:#dcf0dd;border:3px solid #74b07d}.tile{width:100px;height:105px;border:2px solid #a77dbd;background:#f9e3ff;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:grab;touch-action:none;user-select:none}.tile.selected{outline:4px solid #e6b456}.tile svg,.slot svg{width:65px;height:65px}.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%);opacity:.88}.btn{border:0;background:#8959b2;color:white;font:inherit;border-radius:15px;padding:11px 18px;cursor:pointer}.hint{font-size:14px}#msg{min-height:25px}.x{float:right;background:transparent;border:0;font-size:25px;cursor:pointer;color:#543366}@media(max-width:500px){.slot,.tile{width:65px;height:75px;font-size:11px}.slot svg,.tile svg{width:40px;height:40px}.panel{padding:9px}header{font-size:11px}}
</style></head><body><header><b>🔎 Detektif Kod Poligon · Cabaran 5</b><a href="detektif-cabaran-4.html">← Cabaran 4</a></header><main><button class="hot gem1" id="gem0" aria-label="Kumpul batu pentagon" onclick="collect(0)"></button><button class="hot gem2" id="gem1" aria-label="Kumpul batu heksagon" onclick="collect(1)"></button><button class="hot gem3" id="gem2" aria-label="Kumpul batu heptagon" onclick="collect(2)"></button><button class="hot gem4" id="gem3" aria-label="Kumpul batu oktagon" onclick="collect(3)"></button><button class="hot door" aria-label="Buka pintu gua" onclick="openDoor()"></button><div class="progress" id="progress" role="status"></div></main><div class="overlay" id="overlay"><section class="panel"><button class="x" onclick="closePanel()" aria-label="Tutup">×</button><div id="content"></div></section></div><script>
const $=id=>document.getElementById(id),names=['Pentagon','Heksagon','Heptagon','Oktagon'],ns=[5,6,7,8];let found=JSON.parse(sessionStorage.getItem('gua5_found')||'[false,false,false,false]'),placed=JSON.parse(sessionStorage.getItem('gua5_placed')||'[null,null,null,null]'),selected=null,drag=null;function shape(n){let points=Array.from({length:n},(_,i)=>{let a=-Math.PI/2+2*Math.PI*i/n;return `${50+38*Math.cos(a)},${50+38*Math.sin(a)}`}).join(' ');return `<svg viewBox="0 0 100 100"><polygon points="${points}" stroke="#8658aa" stroke-width="4" fill="#dca5f4"/></svg>`}function save(){sessionStorage.setItem('gua5_found',JSON.stringify(found));sessionStorage.setItem('gua5_placed',JSON.stringify(placed))}function update(){found.forEach((v,i)=>$('gem'+i).classList.toggle('gone',v));$('progress').textContent=`💎 Batu dikumpul: ${found.filter(Boolean).length}/4 · 🔐 Dipasang: ${placed.filter(v=>v!==null).length}/4`}function collect(i){if(found[i])return;found[i]=true;save();update();if(found.every(Boolean))show('<h2>✨ Semua batu berjaya dikumpulkan!</h2><p>Sentuh pintu gua untuk memasang empat batu pada panel kunci.</p><button class="btn" onclick="openDoor()">Pergi ke pintu →</button>')}function show(s){$('content').innerHTML=s;$('overlay').classList.add('on')}function closePanel(){$('overlay').classList.remove('on')}function openDoor(){if(!found.every(Boolean)){show(`<h2>🔒 Pintu Gua Masih Berkunci</h2><p>Cari dan sentuh semua empat batu bercahaya dahulu.</p><p>Sudah ditemui: ${found.filter(Boolean).length}/4</p><button class="btn" onclick="closePanel()">Sambung mencari</button>`);return}if(placed.every(v=>v!==null)){win();return}board()}function board(){let remain=[2,0,3,1].filter(i=>!placed.includes(i));show(`<h2>🔐 Kunci Pintu Poligon</h2><p>Seret setiap batu ke ruang mengikut bilangan sisi lurus.</p><div class="slots">${ns.map((n,i)=>`<div class="slot ${placed[i]!==null?'filled':''}" data-slot="${i}" tabindex="0" role="button" aria-label="Ruang ${n} sisi">${placed[i]!==null?shape(ns[placed[i]]):'❔'}<small>${n} sisi</small></div>`).join('')}</div><div class="tiles">${remain.map(i=>`<div class="tile" data-tile="${i}" tabindex="0" role="button" aria-label="${names[i]}">${shape(ns[i])}<small>${names[i]}</small></div>`).join('')}</div><p class="hint">Boleh juga sentuh batu, kemudian sentuh ruang.</p><p id="msg" role="status"></p>`);document.querySelectorAll('.tile').forEach(el=>{el.addEventListener('pointerdown',down);el.addEventListener('click',()=>select(+el.dataset.tile));el.addEventListener('keydown',e=>{if(e.key==='Enter'){select(+el.dataset.tile)}})});document.querySelectorAll('.slot').forEach(el=>{el.addEventListener('click',()=>{if(selected!==null)place(selected,+el.dataset.slot)});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&selected!==null)place(selected,+el.dataset.slot)})})}function select(i){selected=i;document.querySelectorAll('.tile').forEach(el=>el.classList.toggle('selected',+el.dataset.tile===i));$('msg').textContent=names[i]+' dipilih. Sentuh ruang yang sesuai.'}function down(e){if(e.pointerType==='mouse'&&e.button!==0)return;let el=e.currentTarget,ghost=el.cloneNode(true);ghost.classList.add('ghost');document.body.appendChild(ghost);drag={i:+el.dataset.tile,id:e.pointerId,ghost};move(e);e.preventDefault()}function move(e){if(!drag||drag.id!==e.pointerId)return;drag.ghost.style.left=e.clientX+'px';drag.ghost.style.top=e.clientY+'px'}function up(e){if(!drag||drag.id!==e.pointerId)return;let d=drag;d.ghost.remove();drag=null;let target=[...document.querySelectorAll('.slot')].find(el=>{let r=el.getBoundingClientRect();return e.clientX>=r.left-20&&e.clientX<=r.right+20&&e.clientY>=r.top-20&&e.clientY<=r.bottom+20});if(target)place(d.i,+target.dataset.slot);else select(d.i)}function place(i,j){if(i!==j){$('msg').textContent='Belum tepat. Kira sisi lurus batu ini semula.';return}if(placed[j]!==null)return;placed[j]=i;selected=null;save();update();if(placed.every(v=>v!==null))win();else board()}function win(){sessionStorage.setItem('gua5_complete','yes');show('<h2>🏆 Pintu Gua Berjaya Dibuka!</h2><p>Syabas! Aina dan Comel berjaya menemukan khazanah poligon terakhir.</p><div class="slots">'+ns.map(n=>shape(n)).join('')+'</div><p><b>Pentagon · Heksagon · Heptagon · Oktagon</b></p><button class="btn" onclick="closePanel()">Selesai ✓</button> <a href="detektif-kod-poligon.html">Kembali ke menu</a>')}window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',()=>{if(drag){drag.ghost.remove();drag=null}});update();
</script></body></html>
