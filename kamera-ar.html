<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Kamera AR-Geo</title><script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script><script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script><style>body{margin:0;overflow:hidden;font-family:Arial,sans-serif}#message{position:fixed;left:10px;right:10px;bottom:14px;background:#fff9e9eb;border-radius:12px;padding:12px;text-align:center;z-index:9;font-size:14px;color:#245d4e}#factsAR{position:fixed;top:12px;left:12px;right:12px;z-index:9;background:#fff9e9ee;border-radius:13px;padding:12px;color:#245d4e;font-size:14px;line-height:1.45;max-width:480px;margin:auto;text-align:center}#factsAR strong{display:block;font-size:19px;margin-bottom:4px}</style></head><body><div id="factsAR" aria-live="polite"></div><div id="message">Halakan kamera pada kad AR-Geo. Jika kamera tidak muncul, semak kebenaran kamera dan sambungan HTTPS.</div><a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true;precision:medium" arjs="sourceType:webcam;debugUIEnabled:false;detectionMode:mono;" device-orientation-permission-ui="enabled:false"><a-marker type="pattern" url="penanda/cube.patt" id="marker-cube"><a-entity id="object-cube" position="0 0.55 0" rotation="0 25 0"></a-entity></a-marker><a-marker type="pattern" url="penanda/cuboid.patt" id="marker-cuboid"><a-entity id="object-cuboid" position="0 0.55 0" rotation="0 25 0"></a-entity></a-marker><a-marker type="pattern" url="penanda/prism.patt" id="marker-prism"><a-entity id="object-prism" position="0 0.55 0" rotation="0 25 0"></a-entity></a-marker><a-marker type="pattern" url="penanda/pyramid.patt" id="marker-pyramid"><a-entity id="object-pyramid" position="0 0.55 0" rotation="0 25 0"></a-entity></a-marker><a-marker type="pattern" url="penanda/cylinder.patt" id="marker-cylinder"><a-entity id="object-cylinder" position="0 0.55 0" rotation="0 25 0"></a-entity></a-marker><a-marker type="pattern" url="penanda/cone.patt" id="marker-cone"><a-entity id="object-cone" position="0 0.55 0" rotation="0 25 0"></a-entity></a-marker><a-marker type="pattern" url="penanda/sphere.patt" id="marker-sphere"><a-entity id="object-sphere" position="0 0.55 0" rotation="0 25 0"></a-entity></a-marker><a-marker preset="hiro" id="marker-hiro"><a-entity id="object-hiro" position="0 0.55 0" rotation="0 25 0"></a-entity></a-marker><a-entity camera></a-entity></a-scene><script>
(function(){
const shapes={cube:['Prisma segi empat sama (kubus)','6 permukaan rata · 8 bucu · 12 tepi','#68c9b1'],cuboid:['Prisma segi empat tepat (kuboid)','6 permukaan rata · 8 bucu · 12 tepi','#9e87e4'],prism:['Prisma segi tiga','5 permukaan rata · 6 bucu · 9 tepi','#ffc66b'],pyramid:['Piramid','5 permukaan rata · 5 bucu · 8 tepi','#e78eae'],cylinder:['Silinder','2 permukaan rata · 1 permukaan melengkung · 0 bucu','#67b8f4'],cone:['Kon','1 tapak bulatan · 1 permukaan melengkung · 1 bucu','#f7a57b'],sphere:['Sfera','1 permukaan melengkung · 0 bucu','#ed95c0']};
const selected=new URLSearchParams(location.search).get('shape')||'cube';
function model(shape,container){const color=shapes[shape][2];let tag='a-box',attrs={depth:1,height:1,width:1};if(shape==='pyramid'){tag='a-cone';attrs={radiusBottom:.72,radiusTop:0,height:1.25,segmentsRadial:4,rotation:'0 45 0'}}if(shape==='cuboid')attrs={depth:.7,height:.9,width:1.45};if(shape==='cylinder'){tag='a-cylinder';attrs={radius:.5,height:1.2,segmentsRadial:48}}if(shape==='cone'){tag='a-cone';attrs={radiusBottom:.58,radiusTop:0,height:1.2,segmentsRadial:48}}if(shape==='sphere'){tag='a-sphere';attrs={radius:.65,segmentsWidth:32,segmentsHeight:24}}if(shape==='prism'){tag='a-entity';attrs={geometry:'primitive: cylinder; radius: 0.66; height: 1.1; segmentsRadial: 3',rotation:'90 0 0'}}const el=document.createElement(tag);Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v));el.setAttribute('material','color:'+color+'; metalness:0; roughness:0.65; opacity:0.95');el.setAttribute('animation','property:rotation; to:0 360 0; loop:true; dur:12000; easing:linear');container.appendChild(el)}
const facts=document.getElementById('factsAR'),msg=document.getElementById('message');
Object.keys(shapes).forEach(key=>{model(key,document.getElementById('object-'+key));const marker=document.getElementById('marker-'+key);marker.addEventListener('markerFound',()=>{facts.innerHTML='<strong>'+shapes[key][0]+'</strong>'+shapes[key][1];msg.textContent='Hebat! Penanda '+shapes[key][0]+' berjaya dikesan.'});marker.addEventListener('markerLost',()=>{msg.textContent='Halakan kamera pada kad penanda AR-Geo.'})});
model(shapes[selected]?selected:'cube',document.getElementById('object-hiro'));
document.getElementById('marker-hiro').addEventListener('markerFound',()=>{let k=shapes[selected]?selected:'cube';facts.innerHTML='<strong>'+shapes[k][0]+'</strong>'+shapes[k][1];msg.textContent='Penanda ujian Hiro dikesan.'});
msg.textContent='Halakan kamera pada salah satu daripada 7 kad AR-Geo atau penanda ujian Hiro.';
})();
</script></body></html>
