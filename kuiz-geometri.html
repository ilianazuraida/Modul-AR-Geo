<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🧩 Kuiz Geometri | AR-Geo</title><style>*{box-sizing:border-box}body{font-family:Nunito,sans-serif;margin:0;background:radial-gradient(circle at 5% 12%,#e3f6ec,transparent 40%),radial-gradient(circle at 90% 75%,#f0e9fa,transparent 45%),#fffdf5;color:#315f51}main{max-width:880px;margin:35px auto;padding:22px}header{background:#fffef8;border:2px solid #d9e5d6;border-radius:26px;overflow:hidden;text-align:center}header img{width:100%;max-height:230px;object-fit:cover;display:block}h1{font:700 38px Kalam,cursive;margin:18px 0 0}.content{background:#fffefa;border:2px solid #d9e5d6;border-radius:24px;margin-top:18px;padding:24px}a,.button{display:inline-block;background:#e4f1ff;border:2px solid #b9d6e8;color:#315f51;padding:12px 18px;border-radius:14px;text-decoration:none;font-weight:900;cursor:pointer;font:800 16px Nunito}p{line-height:1.6}.muted{color:#647e72}button:focus-visible,a:focus-visible{outline:3px solid #397fc0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.answers button{background:#eaf3ff}.answers button:hover{background:#d5e8ff}@media(max-width:550px){.answers{grid-template-columns:1fr}h1{font-size:30px}}

/* Tipografi baharu: tiada Kalam, Baloo 2 atau huruf condong. */
html,body,button,input,select,textarea,a,p,span,div,label,li,h1,h2,h3,h4,strong,small {font-family:'Mali','Trebuchet MS',sans-serif!important;font-style:normal!important;}
h1,h2,h3,h4,.card h2,.title,.pill {font-weight:700!important;letter-spacing:-.025em;line-height:1.2;}
button,.btn,.back,.button,a.card,.quick a {font-weight:700!important;font-style:normal!important;}
body,p,li,.muted,.hint {font-weight:600;line-height:1.55;}
</style><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&display=swap" rel="stylesheet"></head><body><main><header><h1>🧩 Kuiz Geometri</h1><img src="banner-aina-comel-ar.png" alt="Aina dan Comel dalam pengembaraan geometri"></header><section class="content"><p>Jawab lima soalan untuk menguji pengetahuan geometri kamu.</p><div id="quiz"><p id="count" class="muted"></p><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" aria-live="polite"></p><button class="button" id="next" hidden>Soalan seterusnya →</button></div><script>
const data=[['Yang manakah bentuk 3D?',['Bulatan','Kubus','Segi tiga','Segi empat sama'],1],['Berapakah bilangan bucu sebuah kubus?',['6','8','10','12'],1],['Yang manakah mempunyai permukaan melengkung?',['Sfera','Kubus','Kuboid','Prisma segi tiga'],0],['Antara berikut, yang manakah bukan poligon?',['Segi tiga','Segi lima','Bulatan','Segi enam'],2],['Bentuk manakah menyerupai kotak kasut?',['Kon','Kuboid','Sfera','Silinder'],1]];
let i=0,score=0,locked=false;const el=id=>document.getElementById(id);function render(){locked=false;el('count').textContent='Soalan '+(i+1)+' / '+data.length+' · Markah '+score;el('question').textContent=data[i][0];el('feedback').textContent='';el('next').hidden=true;el('answers').replaceChildren();data[i][1].forEach((v,n)=>{const b=document.createElement('button');b.textContent=String.fromCharCode(65+n)+'. '+v;b.onclick=()=>{if(locked)return;locked=true;const ok=n===data[i][2];if(ok)score++;el('feedback').textContent=ok?'🌟 Betul! Syabas!':'Cuba lagi pada soalan lain. Jawapan betul: '+data[i][1][data[i][2]];for(const btn of el('answers').children)btn.disabled=true;b.style.background=ok?'#d9f1df':'#ffe2e0';el('next').hidden=false;el('next').textContent=i===data.length-1?'Lihat keputusan →':'Soalan seterusnya →'};el('answers').appendChild(b)})}el('next').onclick=()=>{i++;if(i<data.length)render();else{el('quiz').replaceChildren();const h=document.createElement('h2');h.textContent='🎉 Tahniah!';const p=document.createElement('p');p.textContent='Markah kamu: '+score+' / '+data.length;const b=document.createElement('button');b.className='button';b.textContent='Main Semula';b.onclick=()=>location.reload();el('quiz').append(h,p,b)}};render();</script></section><p><a href="index.html">← Kembali ke Menu Utama</a></p></main></body></html>
