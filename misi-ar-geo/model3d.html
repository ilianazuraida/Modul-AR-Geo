<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Makmal 3D Aina dan Comel</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fff4df;color:#31563e;text-align:center}.wrap{max-width:820px;margin:auto;padding:15px}h1{color:#80502d}p{line-height:1.5}canvas{width:100%;height:390px;display:block;touch-action:none;cursor:grab;border-radius:22px;background:linear-gradient(#dceff0,#fff9e8);border:4px solid #e4c393}select,button{font:inherit;border-radius:12px;padding:11px 15px;border:2px solid #c7ac79;background:#fffdf5;color:#31563e;font-weight:700}button{cursor:pointer;background:#e4f1d8}button:focus-visible,select:focus-visible{outline:3px solid #bd7b25}.toolbar{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:14px 0}.info{background:#fffdf6;border:2px solid #e6d6ae;border-radius:18px;padding:14px;margin:12px auto;max-width:600px}.back{display:inline-block;margin:12px;color:#365d45;font-weight:bold}small{color:#6c6c5e}
/* Tipografi AR-Geo: tajuk dan kawalan tulisan tangan, teks pembelajaran mudah dibaca. */
@import url('https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Nunito:wght@400;600;700;800;900&display=swap');
:root,body,button,input,select,textarea{font-family:'Nunito',system-ui,-apple-system,sans-serif;}
h1,h2,h3,h4,header strong,.pill,.btn,#mapNext,.dialog button,.gamepanel button,.chest small{font-family:'Kalam','Comic Sans MS',cursive!important;}
#mapNext{font-weight:700!important;}
.gamepanel p,.gamepanel .question,.gamepanel .feedback,.dialog p{font-family:'Nunito',system-ui,sans-serif;}


html,body{width:100%;max-width:100%;overflow-x:hidden}
body.embedded-view{background:transparent;margin:0;padding:0;overflow:hidden}
body.embedded-view .wrap{width:100%;height:100vh;max-width:none;margin:0;padding:0!important;display:block}
body.embedded-view .wrap>h1,body.embedded-view .wrap>p,body.embedded-view .wrap>.back,body.embedded-view .wrap>.toolbar,body.embedded-view .wrap>.info,body.embedded-view .wrap>small,body.embedded-view .argeo-home-nav{display:none!important}
body.embedded-view canvas#scene{display:block;width:100%;height:100vh!important;max-height:100vh;border:0;border-radius:12px;margin:0;padding:0;box-sizing:border-box;touch-action:none}
</style><style id="argeo-home-nav-style">.argeo-home-nav{position:fixed;top:12px;left:12px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:11px 15px;border:2px solid #78bca3;border-radius:999px;background:#f2fff7;color:#205a47!important;font:800 15px/1.2 system-ui,-apple-system,sans-serif!important;text-decoration:none!important;box-shadow:0 4px 14px #1d62452b;max-width:calc(100vw - 24px)}.argeo-home-nav:hover,.argeo-home-nav:focus-visible{background:#dbf6e6;outline:2px solid #257f60;outline-offset:2px}@media(max-width:550px){.argeo-home-nav{top:8px;left:8px;padding:9px 11px;font-size:12px!important}}</style></head><body><div class="wrap"><a class="back" href="index.html">← Kembali ke Peta Pengembaraan</a><h1>🌿 Makmal Bentuk 3D</h1><p>Jom bantu Aina dan Comel meneroka bentuk! Sentuh dan seret objek untuk memutarkannya.</p><div class="toolbar"><label for="shape">Pilih bentuk: </label><select id="shape"><option value="cube">Kubus</option><option value="cuboid">Kuboid</option><option value="tri">Prisma segi tiga</option></select></div><canvas id="scene" aria-label="Model geometri tiga dimensi boleh diputar" role="img"></canvas><div class="toolbar"><button id="left">↶ Putar kiri</button><button id="right">Putar kanan ↷</button><button id="up">↑ Lihat atas</button><button id="reset">⟲ Set semula</button></div><div class="info" id="facts" aria-live="polite"></div><small>Model 3D interaktif berfungsi tanpa internet. Ini bukan AR melalui kamera.</small></div><script>
(function(){'use strict';const c=document.getElementById('scene'),ctx=c.getContext('2d'),sel=document.getElementById('shape'),facts=document.getElementById('facts');let yaw=-.65,pitch=.4,drag=false,prev=null;const V=(x,y,z)=>[x,y,z];function cuboid(w,h,d){let x=w/2,y=h/2,z=d/2;return {v:[V(-x,-y,-z),V(x,-y,-z),V(x,y,-z),V(-x,y,-z),V(-x,-y,z),V(x,-y,z),V(x,y,z),V(-x,y,z)],f:[[0,3,2,1],[4,5,6,7],[0,4,7,3],[1,2,6,5],[3,7,6,2],[0,1,5,4]]}}function tri(){return {v:[V(-1,-.8,-.8),V(1,-.8,-.8),V(0,.95,-.8),V(-1,-.8,.8),V(1,-.8,.8),V(0,.95,.8)],f:[[0,2,1],[3,4,5],[0,3,5,2],[1,2,5,4],[0,1,4,3]]}}const models={cube:cuboid(1.65,1.65,1.65),cuboid:cuboid(2.3,1.3,1.5),tri:tri()};const colors={cube:['#f47c62','#f9a18a','#c93f31','#e35443','#f8b5a2','#d95a45'],cuboid:['#5fc8ae','#91e0d1','#298f85','#40b4a1','#b0e8db','#279c8d'],tri:['#ffbe54','#ffd57e','#ee8e33','#f3a640','#db782c']};const details={cube:'🟥 <b>Kubus</b>: 6 permukaan segi empat sama, 12 garis tepi dan 8 bucu.',cuboid:'🟩 <b>Kuboid</b>: 6 permukaan segi empat tepat, 12 garis tepi dan 8 bucu. Permukaan segi empat sama juga boleh berlaku.',tri:'🟨 <b>Prisma segi tiga</b>: 2 tapak segi tiga yang kongruen, 3 permukaan sisi segi empat tepat, 9 garis tepi dan 6 bucu.'};function rotate(p){let [x,y,z]=p;let X=x*Math.cos(yaw)+z*Math.sin(yaw),Z=-x*Math.sin(yaw)+z*Math.cos(yaw);return [X,y*Math.cos(pitch)-Z*Math.sin(pitch),y*Math.sin(pitch)+Z*Math.cos(pitch)]}function render(){let r=c.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);if(c.width!==Math.round(r.width*dpr)||c.height!==Math.round(r.height*dpr)){c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr)}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);const m=models[sel.value],v=m.v.map(rotate),scale=Math.min(r.width/4.8,r.height/3.6);const project=p=>[r.width/2+p[0]*scale*3.8/(3.8-p[2]),r.height/2-p[1]*scale*3.8/(3.8-p[2])];let faces=m.f.map((ids,i)=>({ids,i,depth:ids.reduce((s,j)=>s+v[j][2],0)/ids.length})).sort((a,b)=>a.depth-b.depth);faces.forEach(({ids,i})=>{ctx.beginPath();ids.forEach((j,k)=>{const p=project(v[j]);if(!k)ctx.moveTo(...p);else ctx.lineTo(...p)});ctx.closePath();ctx.fillStyle=colors[sel.value][i];ctx.fill();ctx.strokeStyle='#583c2c';ctx.lineWidth=2.5;ctx.lineJoin='round';ctx.stroke()})}function update(){facts.innerHTML=details[sel.value];render()}sel.addEventListener('change',update);c.addEventListener('pointerdown',e=>{drag=true;prev=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-prev[0])*.012;pitch=Math.max(-1.5,Math.min(1.5,pitch+(e.clientY-prev[1])*.012));prev=[e.clientX,e.clientY];render()});function stop(){drag=false}c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);document.getElementById('left').onclick=()=>{yaw-=.3;render()};document.getElementById('right').onclick=()=>{yaw+=.3;render()};document.getElementById('up').onclick=()=>{pitch=Math.min(1.5,pitch+.3);render()};document.getElementById('reset').onclick=()=>{yaw=-.65;pitch=.4;render()};window.addEventListener('message',function(e){if(e.source!==window.parent||!e.data||!e.data.arGeo3d)return;const m=e.data.arGeo3d;if(m.type==='rotate'&&Number.isFinite(m.delta)){yaw+=m.delta;render()}else if(m.type==='shape'&&models[m.value]){sel.value=m.value;update()}else if(m.type==='reset'){yaw=-.65;pitch=.4;render()}});if(new URLSearchParams(location.search).has('embedded')){document.body.classList.add('embedded-view');document.querySelector('h1').style.display='none';document.querySelector('.back').style.display='none';document.querySelector('.wrap > p').style.display='none';document.querySelectorAll('.toolbar').forEach(x=>x.style.display='none');document.querySelector('.info').style.display='none';document.querySelector('small').style.display='none';document.querySelector('canvas').style.height='330px';document.querySelector('.wrap').style.padding='4px'}window.addEventListener('resize',render);update()})();
</script></body></html>
