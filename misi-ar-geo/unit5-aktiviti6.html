*{box-sizing:border-box}body{margin:0;font:17px system-ui,sans-serif;color:#315349;background:linear-gradient(120deg,#fff0df,#e8f7ef,#f4edff)}main{max-width:850px;margin:auto;padding:18px 14px 65px}nav{display:flex;gap:10px;flex-wrap:wrap}a,button{font:inherit;cursor:pointer;border:2px solid #a8cdbb;border-radius:14px;background:#fffdf7;color:#315349;padding:11px 15px;text-decoration:none;font-weight:750}button:focus-visible,a:focus-visible{outline:3px solid #7955b2;outline-offset:2px}.panel{background:#fffefa;border:2px solid #c9dfd0;border-radius:23px;padding:22px;margin-top:18px;box-shadow:0 8px 20px #31534914}.intro{display:flex;gap:14px;align-items:center}.intro img{width:82px;height:82px;object-fit:contain}h1{font-size:clamp(26px,5vw,39px);margin:8px 0}h2{font-size:23px}#choices{display:grid;gap:10px;margin:20px 0}.choice{text-align:left;display:flex;align-items:center;gap:10px}.choice[aria-pressed=true]{background:#e4f4eb;border-color:#4d9a79}.choice span{border:1px solid #b6d5c4;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;flex-shrink:0}.muted{color:#60766c}.progress{height:13px;background:#e8e9df;border-radius:30px;overflow:hidden}.bar{height:100%;background:#8dbda6;transition:width .2s}.illustration{display:flex;justify-content:center;align-items:center;min-height:155px;background:#fff8ee;border-radius:18px;margin-top:14px}.illustration svg{max-width:100%;height:155px}.feedback{background:#f3f0ff;border-radius:12px;padding:13px;margin:14px 0}#next{background:#e1f1e8}#result{display:none}small{line-height:1.5}@media(max-width:480px){.panel{padding:15px}.intro img{width:62px;height:62px}}

</style><style id="argeo-home-nav-style">.argeo-home-nav{position:fixed;top:12px;left:12px;z-index:2147483000;display:inline-flex;align-items:center;gap:7px;padding:11px 15px;border:2px solid #78bca3;border-radius:999px;background:#f2fff7;color:#205a47!important;font:800 15px/1.2 system-ui,-apple-system,sans-serif!important;text-decoration:none!important;box-shadow:0 4px 14px #1d62452b;max-width:calc(100vw - 24px)}.argeo-home-nav:hover,.argeo-home-nav:focus-visible{background:#dbf6e6;outline:2px solid #257f60;outline-offset:2px}@media(max-width:550px){.argeo-home-nav{top:8px;left:8px;padding:9px 11px;font-size:12px!important}}</style><script src="profile-storage.js"></script></head><body><a class="argeo-home-nav" href="../index.html" aria-label="Kembali ke Menu Utama AR-Geo">⌂ &nbsp; Kembali ke Menu Utama</a><main><nav><a href="index.html">🏡 Peta Pengembaraan</a><a href="unit5-aktiviti5.html">← Aktiviti 5</a><a href="unit5-menu.html">📚 Menu Unit 5</a></nav><section class="panel"><div class="intro"><img src="aina.png" alt="Aina"><div><div class="muted">Unit 5 · Aktiviti 6 · Penilaian akhir</div><h1>🌟 Uji Diri: Pakar Simetri!</h1><p>Aina dan Comel mahu melihat sejauh mana kamu menguasai paksi simetri. Jawab 10 soalan, kemudian semak keputusan kamu!</p></div><img src="comel.png" alt="Comel"></div></section><section class="panel" id="quiz"><div id="counter" class="muted"></div><div class="progress"><div id="bar" class="bar" style="width:0%"></div></div><h2 id="question"></h2><div class="illustration" id="picture" aria-label="Rajah soalan"></div><div id="choices" role="group" aria-label="Pilihan jawapan"></div><div id="feedback" class="feedback" hidden aria-live="polite"></div><button id="check" disabled>Semak jawapan</button> <button id="next" hidden>Soalan seterusnya →</button></section><section class="panel" id="result" aria-live="polite"><h2>🏆 Keputusan Uji Diri</h2><h1 id="score"></h1><p id="comment"></p><div id="review"></div><button id="again">🔄 Cuba semula</button> <a href="unit5-menu.html">📚 Menu Unit 5</a></section></main><script>
const svg=(shape,line)=>{let shapes={square:'<rect x="80" y="28" width="110" height="110" fill="#f4c8a3" stroke="#765c68" stroke-width="3"/>',rect:'<rect x="55" y="46" width="160" height="75" fill="#b8e3d0" stroke="#517768" stroke-width="3"/>',isos:'<path d="M135 20 L55 140 L215 140 Z" fill="#e9c6ee" stroke="#795a8a" stroke-width="3"/>',scalene:'<path d="M80 135 L140 25 L224 135 Z" fill="#f6d99e" stroke="#8a6e4b" stroke-width="3"/>',parallelogram:'<path d="M90 40 L220 40 L175 125 L45 125 Z" fill="#b6d7ed" stroke="#526c84" stroke-width="3"/>',circle:'<circle cx="135" cy="82" r="65" fill="#e5c4e7" stroke="#84608a" stroke-width="3"/>',rhombus:'<path d="M135 14 L205 82 L135 150 L65 82 Z" fill="#b8e2ce" stroke="#5e8b78" stroke-width="3"/>',heart:'<path d="M135 141 C112 118 44 76 62 42 C77 12 115 20 135 49 C155 20 193 12 208 42 C226 76 158 118 135 141 Z" fill="#f4bac4" stroke="#ac6979" stroke-width="3"/>'};return '<svg viewBox="0 0 270 165" role="img" aria-label="Bentuk geometri">'+(shapes[shape]||'')+(line?'<line x1="'+line[0]+'" y1="'+line[1]+'" x2="'+line[2]+'" y2="'+line[3]+'" stroke="#7853b4" stroke-width="4" stroke-dasharray="8 6"/>':'')+'</svg>'};
const questions=[
{q:'Berapakah bilangan paksi simetri segi empat sama?',shape:'square',opts:['1','2','4','0'],a:2,why:'Segi empat sama mempunyai 4 paksi simetri: menegak, mengufuk dan dua pepenjuru.'},
{q:'Berapakah bilangan paksi simetri segi empat tepat (bukan segi empat sama)?',shape:'rect',opts:['0','1','2','4'],a:2,why:'Segi empat tepat mempunyai dua paksi simetri, iaitu menegak dan mengufuk.'},
{q:'Berapakah bilangan paksi simetri segi tiga sama kaki yang ditunjukkan?',shape:'isos',opts:['0','1','2','3'],a:1,why:'Segi tiga sama kaki ini mempunyai satu paksi simetri melalui puncak dan titik tengah tapak.'},
{q:'Adakah garis putus-putus ini paksi simetri bagi segi empat tepat?',shape:'rect',line:[135,10,135,155],opts:['Ya','Tidak'],a:0,why:'Garis menegak melalui tengah segi empat tepat membahagikannya kepada dua bahagian yang sepadan.'},
{q:'Adakah garis putus-putus ini paksi simetri bagi segi empat tepat?',shape:'rect',line:[70,20,205,145],opts:['Ya','Tidak'],a:1,why:'Garis condong ini bukan paksi simetri segi empat tepat tersebut; kedua-dua bahagian tidak bertindih tepat apabila dilipat.'},
{q:'Berapakah paksi simetri bagi jajaran genjang yang ditunjukkan?',shape:'parallelogram',opts:['0','1','2','4'],a:0,why:'Jajaran genjang condong ini tiada paksi simetri.'},
{q:'Apakah maksud paksi simetri?',shape:'heart',opts:['Garis yang membahagikan bentuk kepada dua bahagian yang bertindih tepat apabila dilipat','Garis yang mesti menghubungkan dua bucu','Garis yang membahagikan bentuk kepada dua bahagian berlainan'],a:0,why:'Paksi simetri ialah garis lipatan yang menghasilkan dua bahagian sepadan dan bertindih tepat.'},
{q:'Berapakah bilangan paksi simetri bulatan?',shape:'circle',opts:['1','2','4','Tidak terhingga'],a:3,why:'Setiap diameter bulatan ialah paksi simetri, jadi bilangannya tidak terhingga.'},
{q:'Apabila satu titik berada 2 petak di kiri paksi simetri menegak, di manakah titik pantulannya?',shape:'square',line:[135,5,135,155],opts:['2 petak di kanan paksi','1 petak di kanan paksi','2 petak di atas paksi'],a:0,why:'Pantulan terletak pada jarak yang sama di sebelah bertentangan paksi.'},
{q:'Berapakah bilangan paksi simetri bentuk hati yang ditunjukkan?',shape:'heart',opts:['0','1','2','4'],a:1,why:'Bentuk hati yang dilukis ini mempunyai satu paksi simetri menegak.'}
];
let i=0,selected=-1,answers=[],locked=false;const $=id=>document.getElementById(id);function show(){const q=questions[i];selected=-1;locked=false;$('counter').textContent='Soalan '+(i+1)+' daripada '+questions.length;$('bar').style.width=(i/questions.length*100)+'%';$('question').textContent=q.q;$('picture').innerHTML=svg(q.shape,q.line);$('choices').innerHTML='';q.opts.forEach((opt,j)=>{let b=document.createElement('button');b.className='choice';b.setAttribute('aria-pressed','false');b.innerHTML='<span>'+String.fromCharCode(65+j)+'</span>';b.append(document.createTextNode(opt));b.onclick=()=>{if(locked)return;selected=j;document.querySelectorAll('.choice').forEach((x,k)=>x.setAttribute('aria-pressed',String(k===j)));$('check').disabled=false};$('choices').append(b)});$('feedback').hidden=true;$('check').hidden=false;$('check').disabled=true;$('next').hidden=true;$('next').textContent=i===questions.length-1?'Lihat keputusan →':'Soalan seterusnya →'}
$('check').onclick=()=>{if(selected<0||locked)return;locked=true;const q=questions[i],correct=selected===q.a;answers.push({q:q.q,correct,chosen:q.opts[selected],answer:q.opts[q.a],why:q.why});$('feedback').hidden=false;$('feedback').textContent=(correct?'✅ Betul! ':'💡 Belum tepat. Jawapan: '+q.opts[q.a]+'. ')+q.why;$('check').hidden=true;$('next').hidden=false;document.querySelectorAll('.choice').forEach(x=>x.disabled=true)};$('next').onclick=()=>{i++;if(i<questions.length)show();else finish()};function finish(){let n=answers.filter(a=>a.correct).length;$('quiz').hidden=true;$('result').style.display='block';$('score').textContent=n+' / '+questions.length;$('comment').textContent=n===10?'Cemerlang! Kamu menguasai paksi simetri.':n>=7?'Bagus! Semak soalan yang kurang tepat dan cuba lagi.':'Teruskan berlatih. Aina dan Comel percaya kamu boleh!';$('review').innerHTML='';answers.forEach((a,j)=>{let p=document.createElement('p');p.textContent=(a.correct?'✅ ':'❌ ')+(j+1)+'. '+a.q+' — '+a.answer+'. '+a.why;$('review').append(p)});try{localStorage.setItem('argeo_unit5_uji_diri',JSON.stringify({score:n,total:questions.length,completed:new Date().toISOString()}))}catch(e){}}$('again').onclick=()=>{i=0;answers=[];$('result').style.display='none';$('quiz').hidden=false;show()};show();
</script><script>
/* AR-Geo: confirm completion to parent menu even on file:// Safari */
(function(){let sent=false;function checkSuccess(){if(sent)return;let v=null;try{v=localStorage.getItem('argeo_unit5_uji_diri')}catch(e){}if(v!=null&&((()=>{try{const d=JSON.parse(v);return d.score>=Math.ceil(d.total*.7)}catch(e){return false}})())){sent=true;try{window.parent.postMessage({type:'argeo:activity:success',mission:5,activity:5},'*')}catch(e){}}}document.addEventListener('click',()=>setTimeout(checkSuccess,100));setInterval(checkSuccess,650);})();
</script>
