<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi 2 — Misteri Gua Kristal</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#261744;font-family:'TreasureHand','Comic Sans MS',system-ui,sans-serif;color:#3e1c56} @font-face{font-family:TreasureHand;src:url('treasure-font-offline.otf')}button{font:inherit;cursor:pointer}#scene{position:absolute;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);left:50%;top:50%;transform:translate(-50%,-50%);background:url('treasure-gua-kristal-bg.png') center/100% 100% no-repeat;overflow:hidden} .hot{position:absolute;top:34%;height:39%;width:15%;border:0;background:transparent;border-radius:35%;z-index:3;cursor:pointer}.hot:focus-visible{outline:5px solid #ffe45e}.hot:disabled{cursor:not-allowed}.hot.done::after{content:'✓';position:absolute;top:12%;right:15%;font-size:4cqw;color:#fff;text-shadow:0 3px 8px #34105a}.hot:not(:disabled):hover{box-shadow:0 0 0 4px #ffe66b88 inset}#scene{container-type:inline-size}.name{position:absolute;left:43.2%;top:2.35%;width:14%;height:4.2%;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(10px,1.45cqw,24px);font-weight:bold;background:#fff1fb;border-radius:40px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 1.1%;z-index:5;box-shadow:0 0 0 2px #f8d7f5}.keycount{position:absolute;right:2.6%;top:3.45%;width:15%;height:5.3%;font-size:clamp(11px,1.55cqw,25px);font-weight:bold;background:#fff1d7;display:flex;align-items:center;justify-content:center;border-radius:30px;white-space:nowrap;z-index:5;box-shadow:0 0 0 2px #c78c52}.back{position:absolute;left:2.6%;bottom:4%;width:22%;height:8%;background:transparent;border:0;z-index:4}.msg{position:absolute;left:34%;bottom:4%;width:36%;text-align:center;background:#fff7e9e8;padding:.5cqw;border-radius:15px;font-size:1.6cqw;z-index:3}.overlay{position:absolute;inset:0;background:#190b38ba;z-index:10;display:none;align-items:center;justify-content:center;padding:2%}.overlay.open{display:flex}.panel{background:radial-gradient(ellipse at 50% 32%,#fffefd 0%,#fff6e7 75%,#f7e1ff 100%);border:8px solid #e3b6fb;border-radius:30px;box-shadow:0 12px 0 #603884,0 20px 55px #180b3a;max-width:980px;width:92%;max-height:94%;overflow:auto;padding:18px 28px;text-align:center;background-image:radial-gradient(circle at 15% 12%,#e3f7ff 0%,transparent 34%),radial-gradient(circle at 87% 80%,#f7dcff 0%,transparent 36%),linear-gradient(#fffaf0,#fff5e9)}.panel h2{font-size:clamp(23px,3vw,40px);margin:0 0 12px}.panel p{font-size:clamp(16px,1.7vw,23px)}.object{margin:10px auto;width:min(100%,490px);height:260px;display:flex;align-items:center;justify-content:center;touch-action:none;cursor:grab;perspective:850px;border-radius:28px;background:radial-gradient(ellipse at center,#d7f7ff 0%,#f2e6ff 52%,#fff9ee 78%);border:3px dashed #bd91e2;box-shadow:inset 0 0 26px #d3b3ff66}.object svg{width:240px;height:220px;filter:drop-shadow(0 14px 9px #59437a55)}.model3d{position:relative;width:130px;height:130px;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-32deg);filter:drop-shadow(0 15px 10px #60427866)}.face{position:absolute;width:130px;height:130px;border:3px solid #68479b;backface-visibility:visible;box-shadow:inset 0 0 25px #ffffff77}.face.front{transform:translateZ(65px);background:#72b9f7}.face.back{transform:rotateY(180deg) translateZ(65px);background:#84d5ff}.face.right{transform:rotateY(90deg) translateZ(65px);background:#3988d7}.face.left{transform:rotateY(-90deg) translateZ(65px);background:#b5e9ff}.face.top{transform:rotateX(90deg) translateZ(65px);background:#d3f8ff}.face.bottom{transform:rotateX(-90deg) translateZ(65px);background:#4f89d2}.model3d.cuboid{width:190px;height:100px}.cuboid .face{width:190px;height:100px}.cuboid .face.front{transform:translateZ(52px)}.cuboid .face.back{transform:rotateY(180deg) translateZ(52px)}.cuboid .face.right,.cuboid .face.left{width:104px;left:43px}.cuboid .face.right{transform:rotateY(90deg) translateZ(95px)}.cuboid .face.left{transform:rotateY(-90deg) translateZ(95px)}.cuboid .face.top,.cuboid .face.bottom{height:104px;top:-2px}.cuboid .face.top{transform:rotateX(90deg) translateZ(50px)}.cuboid .face.bottom{transform:rotateX(-90deg) translateZ(50px)}.object .hint{position:absolute;bottom:8px;font-size:14px;color:#6d4a88;pointer-events:none}.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:16px 0}.choices button,.action{border:3px solid #7b42a5;border-radius:18px;background:#f0d9ff;padding:10px 18px;font-weight:bold;font-size:19px;color:#442065}.choices button:hover,.action:hover{background:#ffe5a2}.feedback{min-height:30px;color:#7140a0;font-size:20px;font-weight:bold}.progress{font-size:20px;color:#633382}.close{background:#8640b4;color:white;border:0;border-radius:20px;padding:10px 20px;font-size:18px}.hidden{display:none!important}@media(max-width:650px){.panel{padding:10px;border-width:4px}.object{height:170px}.object svg{height:155px;width:180px}.model3d{zoom:.72}.choices button{font-size:13px;padding:7px}.panel p{font-size:13px}}
</style></head><body><main id="scene" aria-label="Misteri Gua Kristal"><div class="name" id="name"></div><div class="keycount" id="keycount"></div><button class="hot" style="left:26%" data-stage="0" aria-label="Cabaran 1 Kenal Bentuk 3D"></button><button class="hot" style="left:43%" data-stage="1" aria-label="Cabaran 2 Ciri Bentuk 3D"></button><button class="hot" style="left:60%" data-stage="2" aria-label="Cabaran 3 Padankan Bentuk dan Ciri"></button><button class="back" aria-label="Kembali ke Pulau" onclick="location.href='treasure-pulau.html'"></button><div class="msg" id="message" aria-live="polite"></div><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="heading"><section class="panel"><h2 id="heading"></h2><div class="progress" id="progress"></div><p id="prompt"></p><div class="object" id="object" aria-label="Putar model dengan seret atau sentuh"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="close" id="close">Tutup</button></section></div></main><script>
const player=(()=>{try{return JSON.parse(localStorage.getItem('arGeoTreasurePlayer')||'{}')}catch(e){return {}}})();const name=String(player.name||'Peneroka').slice(0,18),avatar=Number(player.avatar)||0;const key='arGeoTreasureProgress:'+name.trim().toLowerCase()+':'+avatar;let state={done:[false,false,false],score:0};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){};if(!Array.isArray(state.done))state.done=[false,false,false];let stageDone=JSON.parse(localStorage.getItem(key+':crystals')||'[false,false,false]');if(!Array.isArray(stageDone)||stageDone.length!==3)stageDone=[false,false,false];const tasks=[{title:'Cabaran 1 — Kenal Bentuk 3D',prompt:'Putar model 3D ini. Apakah nama bentuk ini?',shape:'cube',options:['Kubus','Kon','Silinder'],correct:0},{title:'Cabaran 2 — Ciri Bentuk 3D',prompt:'Putar kuboid ini. Berapakah bilangan permukaan ratanya?',shape:'cuboid',options:['4 permukaan','6 permukaan','8 permukaan'],correct:1},{title:'Cabaran 3 — Padankan Bentuk & Ciri',prompt:'Bentuk 3D manakah mempunyai satu tapak bulat dan satu puncak?',shape:'cone',options:['Sfera','Kuboid','Kon'],correct:2}];const scene=document.getElementById('scene'),overlay=document.getElementById('overlay');let current=0,rotation=0;document.getElementById('name').textContent=name;function refresh(){document.getElementById('keycount').textContent='🔑 Kunci '+state.done.filter(Boolean).length+'/3';document.querySelectorAll('.hot').forEach((b,i)=>{b.classList.toggle('done',stageDone[i]);b.disabled=i>0&&!stageDone[i-1]});document.getElementById('message').textContent=state.done[1]?'✨ Gua Kristal selesai! Dua huruf rahsia diperoleh.':'Sentuh kristal mengikut turutan untuk menyelesaikan cabaran.'}function model(kind){if(kind==='cube'||kind==='cuboid'){return '<div class="model3d '+(kind==='cuboid'?'cuboid':'')+'" aria-label="Model 3D boleh diputar">'+['front','back','left','right','top','bottom'].map(f=>'<div class="face '+f+'"></div>').join('')+'</div><span class="hint">↔ Seret untuk memutar bentuk</span>'}return '<svg viewBox="0 0 240 220" aria-label="Kon 3D" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="coneg"><stop stop-color="#fff0b0"/><stop offset=".65" stop-color="#ffc660"/><stop offset="1" stop-color="#e99435"/></linearGradient></defs><ellipse cx="120" cy="177" rx="85" ry="25" fill="#dc9b49" stroke="#7b4f8d" stroke-width="3"/><path d="M120 18 L35 177 Q120 211 205 177 Z" fill="url(#coneg)" stroke="#7b4f8d" stroke-width="4"/><path d="M120 18 L120 201 Q174 196 205 177 Z" fill="#e9a33f" opacity=".6"/><ellipse cx="120" cy="177" rx="85" ry="25" fill="none" stroke="#7b4f8d" stroke-width="3"/></svg><span class="hint">↔ Seret untuk memutar bentuk</span>'}function openStage(i){if(i>0&&!stageDone[i-1])return;if(stageDone[i]){document.getElementById('message').textContent='Kristal ini sudah menyala ✓';return}current=i;rotation=-32;let t=tasks[i];document.getElementById('heading').textContent=t.title;document.getElementById('progress').textContent='Kristal '+(i+1)+' / 3';document.getElementById('prompt').textContent=t.prompt+' (Seret model untuk memutarnya.)';document.getElementById('object').innerHTML=model(t.shape);document.getElementById('feedback').textContent='';document.getElementById('choices').innerHTML='';t.options.forEach((o,j)=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(j);document.getElementById('choices').append(b)});overlay.classList.add('open')}function answer(j){if(j!==tasks[current].correct){document.getElementById('feedback').textContent='Belum tepat. Cuba lagi!';return}stageDone[current]=true;localStorage.setItem(key+':crystals',JSON.stringify(stageDone));document.getElementById('feedback').textContent='✨ Tepat! Kristal '+(current+1)+' kini bercahaya.';document.getElementById('choices').innerHTML='';if(stageDone.every(Boolean)&&!state.done[1]){state.done[1]=true;state.score=(Number(state.score)||0)+30;localStorage.setItem(key,JSON.stringify(state));const letters=['P','R','I','S','M','A'];let prize={};try{prize=JSON.parse(localStorage.getItem(key+':letters')||'{}')}catch(e){};if(!prize[1]){const remain=letters.filter(l=>!Object.values(prize).flat().includes(l));for(let i=remain.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[remain[i],remain[j]]=[remain[j],remain[i]]}prize[1]=remain.slice(0,2);localStorage.setItem(key+':letters',JSON.stringify(prize))}document.getElementById('feedback').textContent+=' 🔑 Kunci kedua diperoleh! Huruf: '+prize[1].join(' dan ')}refresh()}document.querySelectorAll('.hot').forEach(b=>b.addEventListener('click',()=>openStage(Number(b.dataset.stage))));document.getElementById('close').onclick=()=>{overlay.classList.remove('open');refresh()};let dragX=null;const obj=document.getElementById('object');obj.addEventListener('pointerdown',e=>{dragX=e.clientX;obj.setPointerCapture(e.pointerId)});obj.addEventListener('pointermove',e=>{if(dragX===null)return;rotation+=(e.clientX-dragX)*1.2;dragX=e.clientX;let model=obj.querySelector('.model3d');if(model)model.style.transform='rotateX(-24deg) rotateY('+rotation+'deg)';let svg=obj.querySelector('svg');if(svg)svg.style.transform='rotateY('+rotation+'deg)'});obj.addEventListener('pointerup',()=>dragX=null);refresh();
</script></body></html>
