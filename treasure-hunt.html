<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR-Geo Treasure Hunt</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:'Trebuchet MS',system-ui,sans-serif;color:#3e2352}body{background:#d4e9ca}.screen{position:relative;width:100vw;height:100dvh;background:url('treasure-hunt-start-new.png') center/100% 100% no-repeat}.hit{position:absolute;border:0;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}.home{left:2%;top:4%;width:20%;height:15%}.name{position:absolute;left:35.4%;top:37.4%;width:30.5%;height:7.2%;border:0;background:#fff;border-radius:99px;padding:0 1%;font-size:clamp(12px,1.5vw,23px);outline:none;color:#43245b}.name:focus{box-shadow:inset 0 0 0 2px #9453b6}.avatars{position:absolute;left:35.4%;top:52.7%;width:30.8%;height:26%;display:flex;gap:7%;}.avatar{flex:1;border:0;background:transparent;cursor:pointer;border-radius:20%;}.avatar[aria-pressed=true]{outline:none;box-shadow:none}.avatar{position:relative;min-width:0;overflow:visible}.avatar[aria-pressed=true]::after{content:"✓";position:absolute;left:50%;top:90%;transform:translate(-50%,-50%);display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:#7c39bd;color:white;font:bold 18px Arial;pointer-events:none}.next{left:38.5%;top:83%;width:26%;height:11%}.overlay{position:absolute;inset:0;background:#1b1234bb;display:none;align-items:center;justify-content:center;padding:15px}.overlay.open{display:flex}.panel{background:#fff7df;border:6px solid #a16fc4;border-radius:24px;padding:24px;max-width:550px;width:100%;box-shadow:0 12px 45px #0005;text-align:center}.panel h2{margin:0 0 10px}.panel button{border:0;border-radius:20px;padding:13px 20px;margin:6px;background:#9d5ac5;color:white;font-size:17px;font-weight:bold;cursor:pointer}.panel button.secondary{background:#418dc7}.panel input{padding:13px;border-radius:12px;border:2px solid #9d5ac5;font-size:18px;width:min(90%,260px)}.note{font-size:14px;line-height:1.5}.error{color:#a32645;font-weight:bold}#status{min-height:20px}@media(max-width:700px){.panel{padding:14px}.panel button{font-size:14px;padding:10px}}
</style></head><body><main class="screen"><a class="hit home" href="dunia-permainan.html" aria-label="Kembali ke Dunia Permainan"></a><label for="playerName" style="position:absolute;left:-9999px">Nama pemain</label><input id="playerName" class="name" maxlength="20" placeholder="Nama anda..." autocomplete="off"><div class="avatars" role="group" aria-label="Pilih avatar"><button class="avatar" aria-label="Avatar Aina" aria-pressed="false" data-avatar="0"></button><button class="avatar" aria-label="Avatar Hadi" aria-pressed="false" data-avatar="1"></button></div><button class="hit next" id="continue" aria-label="Teruskan"></button><div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="heading"><div class="panel"><h2 id="heading">Jom Mulakan Pengembaraan!</h2><p id="welcome"></p><button id="create">Main Solo — Mula Pengembaraan</button><button class="secondary" id="join">Sertai Rakan</button><div id="joinPanel" hidden><p>Masukkan kod pengembaraan:</p><input id="roomCode" maxlength="6" placeholder="Contoh: GEO123"><button id="joinGo">Sertai</button></div><p id="status" class="error"></p><p class="note">Versi ini ialah halaman permulaan V38. Multiplayer antara peranti belum diaktifkan; ia memerlukan konfigurasi Firebase dan sambungan real-time.</p><button class="secondary" id="back">Kembali</button></div></div></main><script>
(function(){
const nameInput=document.getElementById('playerName');
const next=document.getElementById('continue');
let avatar=null;
try{const p=JSON.parse(localStorage.getItem('arGeoTreasurePlayer')||'{}');nameInput.value=p.name||'';}catch(e){}
function selectAvatar(n){avatar=(n===1?1:0);document.querySelector('.avatars').style.outline='none';document.querySelectorAll('.avatar').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n)));try{localStorage.setItem('arGeoTreasurePlayer',JSON.stringify({name:nameInput.value.trim(),avatar}));}catch(e){}}

document.querySelectorAll('.avatar').forEach((b,i)=>b.addEventListener('click',()=>selectAvatar(i)));
function startGame(){
 const name=nameInput.value.trim();
 if(avatar===null){document.querySelector('.avatars').style.outline='3px dashed #a353bd';return;}
 if(!name){nameInput.focus();nameInput.setAttribute('placeholder','Masukkan nama dahulu');nameInput.style.outline='3px solid #d74c67';return;}
 try{localStorage.setItem('arGeoTreasurePlayer',JSON.stringify({name,avatar}));}catch(e){/* Safari file:// private mode: still allow play */}
 try{sessionStorage.removeItem('arGeoTreasureRoom');}catch(e){}
 window.location.assign('treasure-pulau.html?player='+encodeURIComponent(name)+'&avatar='+avatar);
}
next.addEventListener('click',startGame);
nameInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();startGame();}});
})();
</script></body></html>
