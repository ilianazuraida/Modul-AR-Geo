<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AR-Geo Treasure Hunt — Berkumpul</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#dceecf;font-family:'Trebuchet MS',system-ui,sans-serif;color:#48265a;display:grid;place-items:center}.world{width:min(100vw,177.2824dvh);aspect-ratio:1670/942;background:linear-gradient(#ffffffb8,#ffffffb8),url('treasure-hunt-start.png') center/cover;position:relative;display:grid;place-items:center}.card{width:min(86%,760px);max-height:90%;overflow:auto;background:#fff8e9;border:5px solid #9b6ad0;border-radius:28px;box-shadow:0 12px 40px #3d265655;padding:clamp(16px,3vw,32px);text-align:center}h1{margin:0 0 8px;font-size:clamp(22px,3vw,38px)}p{line-height:1.5}button{border:0;border-radius:18px;padding:12px 20px;background:#9453c9;color:white;font-size:clamp(14px,1.6vw,19px);font-weight:bold;cursor:pointer;margin:5px}button.alt{background:#338fc4}button:disabled{opacity:.5;cursor:not-allowed}input{border:2px solid #a47ad0;border-radius:14px;padding:12px;font-size:18px;width:min(100%,230px);text-transform:uppercase}.muted{color:#705e76;font-size:14px}.note{background:#f4e7ff;border-radius:14px;padding:12px;font-size:14px;margin:15px 0}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}.hidden{display:none}.pill{background:#e7d8f8;border-radius:20px;padding:8px 14px;display:inline-block}a{color:#6234a2}#message{color:#8e3350;min-height:22px;font-weight:bold}
</style><script src="treasure-firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><style id="treasure-font-v39">@import url('https://fonts.googleapis.com/css2?family=Itim&display=swap');@font-face{font-family:'TreasureOffline';src:url('./treasure-font-offline.otf') format('opentype');font-style:normal;font-weight:400 900;font-display:swap}html,body,button,input,select,textarea,.wrap,.wrap *, .panel,.panel *{font-family:'Itim','TreasureOffline',cursive!important}button,.banner strong,.location,.hud,.missions{letter-spacing:.015em} </style></head><body><main class="world"><section class="card"><h1>🌴 Jom Berkumpul!</h1><p id="greeting"></p><div id="choices"><p>Pilih cara memulakan pengembaraan.</p><div class="row"><button id="create">Mula Pengembaraan</button><button id="join" class="alt">Sertai Rakan</button></div></div><div id="hostPanel" class="hidden"><h2>Pengembaraan Baharu</h2><p>Kod pengembaraan (contoh setempat): <strong id="code" class="pill"></strong></p><p class="muted" id="roomStatus">Menunggu pemain menyertai...</p><div id="roomPlayers" aria-live="polite"></div><button id="demo" disabled>Mula Pengembaraan</button></div><div id="joinPanel" class="hidden"><h2>Sertai Pengembaraan</h2><p>Masukkan kod daripada rakan:</p><input id="room" maxlength="6" aria-label="Kod pengembaraan" placeholder="GEO123"><button id="tryJoin">Sertai</button></div><p id="message" role="status"></p><div class="note" id="connectionNote">Menyemak sambungan multiplayer...</div><a href="treasure-hunt.html">← Kembali pilih avatar</a></section></main><script>
const $=id=>document.getElementById(id);
let player={};try{player=JSON.parse(localStorage.getItem('arGeoTreasurePlayer')||'{}')}catch(e){}
if(!player.name||!Number.isInteger(player.avatar))location.replace('treasure-hunt.html');
$('greeting').textContent='Selamat datang, '+(player.name||'Peneroka')+'!';
const show=id=>{$('choices').classList.add('hidden');$('hostPanel').classList.add('hidden');$('joinPanel').classList.add('hidden');$(id).classList.remove('hidden')};
let db,uid,roomId='',unsub=null;const configured=!!(window.AR_GEO_FIREBASE_CONFIG&&window.AR_GEO_FIREBASE_CONFIG.databaseURL);
async function init(){if(!configured){$('connectionNote').textContent='Mod demo sahaja: isi tetapan Firebase dalam treasure-firebase-config.js untuk multiplayer antara peranti.';return}try{if(!window.firebase)throw Error('Firebase tidak dimuatkan. Pastikan sambungan internet aktif.');firebase.initializeApp(window.AR_GEO_FIREBASE_CONFIG);const a=await firebase.auth().signInAnonymously();uid=a.user.uid;db=firebase.database();$('connectionNote').textContent='Sambungan sedia. Kongsi kod dengan rakan untuk bermain bersama.'}catch(e){$('connectionNote').textContent='Firebase belum tersedia: '+e.message}}
const code=()=>Array.from({length:6},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
async function addSelf(id){const ref=db.ref('treasureRooms/'+id+'/players/'+uid);await ref.set({name:String(player.name).slice(0,24),avatar:player.avatar,x:210,y:485,score:0});ref.onDisconnect().remove()}
function watch(id){if(unsub)unsub.off();unsub=db.ref('treasureRooms/'+id);unsub.on('value',s=>{const r=s.val();if(!r){$('message').textContent='Pengembaraan tidak ditemui.';return}const ps=Object.values(r.players||{});$('roomPlayers').textContent='Pemain: '+ps.map(p=>p.name).join(' · ')+' ('+ps.length+'/4)';$('roomStatus').textContent=ps.length<2?'Menunggu sekurang-kurangnya 2 pemain...':'Pasukan bersedia!';$('demo').disabled=ps.length<2;if(r.started){sessionStorage.setItem('arGeoTreasureRoom',id);location.href='treasure-pulau.html'}})}
$('create').onclick=async()=>{show('hostPanel');if(!db){$('code').textContent='DEMO';$('roomStatus').textContent='Tiada sambungan Firebase. Boleh cuba pulau secara solo.';$('demo').disabled=false;return}try{roomId=code();await db.ref('treasureRooms/'+roomId).set({host:uid,createdAt:firebase.database.ServerValue.TIMESTAMP,progress:{done:[false,false,false],scoreTotal:0}});await addSelf(roomId);$('code').textContent=roomId;watch(roomId)}catch(e){$('message').textContent=e.message}};
$('join').onclick=()=>show('joinPanel');
$('tryJoin').onclick=async()=>{if(!db){$('message').textContent='Sambungkan Firebase dahulu.';return}const id=$('room').value.trim().toUpperCase();if(!/^[A-Z2-9]{6}$/.test(id)){$('message').textContent='Masukkan kod enam aksara.';return}try{const snap=await db.ref('treasureRooms/'+id).once('value');if(!snap.exists())throw Error('Kod tidak ditemui.');if(Object.keys(snap.val().players||{}).length>=4)throw Error('Pengembaraan penuh.');await addSelf(id);roomId=id;show('hostPanel');$('code').textContent=id;$('demo').style.display='none';watch(id)}catch(e){$('message').textContent=e.message}};
$('demo').onclick=async()=>{if(!db){sessionStorage.removeItem('arGeoTreasureRoom');location.href='treasure-pulau.html';return}if(!roomId)return;try{await db.ref('treasureRooms/'+roomId+'/started').set(true)}catch(e){$('message').textContent=e.message}};
init();
</script></body></html>
