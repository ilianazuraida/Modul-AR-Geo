<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misi 3 — Peti Harta Karun</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#e2d3fb;font-family:'TreasureHand','Comic Sans MS',system-ui,sans-serif;color:#36104c}body{display:grid;place-items:center}.stage{width:min(100vw,177.78vh);aspect-ratio:16/9;position:relative;overflow:hidden;background:#a4dbed url('treasure-peti-latar.png') center/100% 100% no-repeat;box-shadow:0 8px 28px #50357733}.hot{position:absolute;cursor:pointer;background:transparent;border:0;touch-action:manipulation}.hot:focus-visible{outline:4px solid #ffe65b;border-radius:15px}.choice{top:54%;height:20%;width:13%;border-radius:18px}.choice:nth-of-type(1){left:30.5%}.choice:nth-of-type(2){left:44.2%}.choice:nth-of-type(3){left:57.7%}.choice.selected{outline:5px solid #fce34b;outline-offset:-5px;background:#fdf59b33}.back{left:2%;bottom:3%;width:24%;height:12%}.send{right:2%;bottom:3%;width:24%;height:12%}.player{position:absolute;left:41.4%;top:1.5%;width:17%;height:6.7%;display:flex;justify-content:center;align-items:center;background:linear-gradient(#fff4ff,#e6c6fc);border:3px solid #9c3cd4;border-radius:30px;font-weight:900;font-size:clamp(12px,2vw,27px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 10px;z-index:2}.key{position:absolute;right:2.8%;top:3%;width:19%;height:7%;display:flex;align-items:center;justify-content:center;background:#fff3d5;border:3px solid #a95b25;border-radius:20px;font-size:clamp(12px,1.8vw,26px);font-weight:900;z-index:2}.message{position:absolute;left:28%;top:77%;width:45%;padding:8px 16px;background:#fff9ed;border:3px solid #c37edc;border-radius:18px;text-align:center;font-size:clamp(12px,1.4vw,20px);font-weight:800;display:none;z-index:3}.message.show{display:block}.overlay{position:absolute;inset:0;background:#25153eaa;display:none;align-items:center;justify-content:center;z-index:5;padding:18px}.overlay.show{display:flex}.panel{background:#fff9ec;border:7px solid #dba2f2;border-radius:28px;padding:clamp(14px,3vw,36px);max-width:640px;width:94%;text-align:center;box-shadow:0 12px 0 #683c8e;max-height:92%;overflow:auto}.panel h2{margin:0 0 12px;font-size:clamp(22px,3vw,38px)}.panel p{font-size:clamp(16px,1.9vw,24px)}.letters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:15px 0}.tile{font-size:26px;font-weight:bold;min-width:48px;min-height:54px;background:#f5d8ff;border:3px solid #9a49c4;border-radius:12px;cursor:pointer}.slots{display:flex;gap:6px;justify-content:center;margin:16px 0}.slot{width:44px;height:50px;background:#fff;border:2px dashed #9a49c4;border-radius:10px;display:grid;place-items:center;font-size:24px}.action{background:#8b39bd;color:white;border:0;border-radius:20px;padding:12px 22px;font:inherit;font-weight:bold;cursor:pointer;margin:5px}.action:focus-visible{outline:3px solid orange}@media(max-width:650px){.player,.key{border-width:1.5px}.panel{border-width:3px}.tile{min-width:36px;min-height:42px}.slot{width:34px;height:40px}}
</style></head><body><main class="stage" aria-label="Permainan Peti Harta Karun"><div class="player" id="playerName"></div><div class="key" id="keyCount"></div><button class="hot choice" style="left:30.5%" data-choice="0" aria-label="Pilih segi empat sama"></button><button class="hot choice" style="left:44.2%" data-choice="1" aria-label="Pilih segi tiga"></button><button class="hot choice" style="left:57.7%" data-choice="2" aria-label="Pilih pentagon"></button><button class="hot back" id="back" aria-label="Kembali ke Pulau"></button><button class="hot send" id="send" aria-label="Hantar Jawapan"></button><div id="message" class="message" role="status"></div><div id="overlay" class="overlay" role="dialog" aria-modal="true"><section class="panel" id="panel"></section></div></main><script>
const $=id=>document.getElementById(id);let player={name:'Peneroka',avatar:0};try{player={...player,...JSON.parse(localStorage.getItem('arGeoTreasurePlayer')||'{}')}}catch(e){};try{let q=new URLSearchParams(location.search);if(q.has('player'))player.name=q.get('player');if(q.has('avatar'))player.avatar=Number(q.get('avatar'))||0}catch(e){};player.name=String(player.name||'Peneroka').trim().slice(0,22);const progressKey='arGeoTreasureProgress:'+player.name.toLowerCase()+':'+String(player.avatar);let progress={done:[false,false,false],score:0};try{progress={...progress,...JSON.parse(localStorage.getItem(progressKey)||'{}')}}catch(e){};progress.done=Array.isArray(progress.done)?[0,1,2].map(i=>!!progress.done[i]):[false,false,false];let selected=-1;function save(){localStorage.setItem(progressKey,JSON.stringify(progress))}function status(){ $('playerName').textContent='♙ '+player.name;$('keyCount').textContent='🔑 '+progress.done.filter(Boolean).length+' / 3'}status();function msg(t){$('message').textContent=t;$('message').classList.add('show');}function modal(content){$('panel').replaceChildren();$('panel').append(content);$('overlay').classList.add('show')}function node(tag,txt,cls){let n=document.createElement(tag);if(txt!==undefined)n.textContent=txt;if(cls)n.className=cls;return n}function close(){ $('overlay').classList.remove('show') }function goBack(){location.href='treasure-pulau.html'}$('back').onclick=goBack;
document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{selected=Number(b.dataset.choice);document.querySelectorAll('[data-choice]').forEach(e=>e.classList.toggle('selected',e===b));msg('Pilihan telah dibuat. Tekan Hantar Jawapan.')});
$('send').onclick=()=>{if(!progress.done[1]){msg('🔒 Selesaikan Jambatan Poligon dan Gua Kristal dahulu.');return}if(progress.done[2]){showLetters();return}if(selected<0){msg('Pilih satu bentuk dahulu.');return}if(selected!==0){msg('Cuba lagi! Perhatikan bilangan sisi dan sudut.');return}progress.done[2]=true;progress.score=(Number(progress.score)||0)+35;const all=['P','R','I','S','M','A'];let earned=progress.letters||[];const remain=all.slice();for(const a of earned){const i=remain.indexOf(a);if(i>=0)remain.splice(i,1)};progress.letters=earned.concat(remain);save();status();showLetters()};
function showLetters(){let box=node('div');box.append(node('h2','🏆 Tahniah, '+player.name+'!'));box.append(node('p','Ketiga-tiga misi selesai! Susun enam huruf rahsia untuk membuka peti harta karun.'));const letters=(progress.letters&&progress.letters.length===6?progress.letters:['P','R','I','S','M','A']).slice();for(let i=letters.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[letters[i],letters[j]]=[letters[j],letters[i]]}let answer=[];let slots=node('div',undefined,'slots');let choices=node('div',undefined,'letters');function redraw(){slots.replaceChildren();for(let i=0;i<6;i++){let s=node('button',answer[i]?.letter||'', 'slot');s.setAttribute('aria-label','Ruang huruf '+(i+1));s.onclick=()=>{if(answer[i]){answer.splice(i,1);redraw()}};slots.append(s)}choices.replaceChildren();letters.forEach((l,i)=>{if(answer.some(a=>a.index===i))return;let b=node('button',l,'tile');b.onclick=()=>{if(answer.length<6){answer.push({letter:l,index:i});redraw()}};choices.append(b)})}box.append(slots,choices);let feedback=node('p','Pilih huruf mengikut urutan.');box.append(feedback);let check=node('button','Semak Kod','action');check.onclick=()=>{if(answer.map(a=>a.letter).join('')==='PRISMA'){box.replaceChildren(node('h2','🎉 PRISMA!'),node('p','Hebat, '+player.name+'! Kod rahsia berjaya diselesaikan dan peti harta karun terbuka!'));let b=node('button','Kembali ke Pulau','action');b.onclick=goBack;box.append(b);progress.codeSolved=true;save()}else feedback.textContent='Kod belum tepat. Cuba susun semula huruf.'};let reset=node('button','Susun Semula','action');reset.onclick=()=>{answer=[];redraw()};let back=node('button','Kembali ke Pulau','action');back.onclick=goBack;box.append(check,reset,back);modal(box);redraw()}
if(progress.done[2])msg('Misi selesai! Tekan Hantar Jawapan untuk menyusun kod PRISMA.');else if(!progress.done[1])msg('Misi 3 terkunci sehingga Misi 2 selesai.');
</script></body></html>
