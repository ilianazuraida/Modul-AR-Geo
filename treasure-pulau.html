function palm(a,b,s=1){ctx.save();ctx.translate(a,b);ctx.scale(s,s);line([[0,0],[7,-58],[2,-112]],'#8a5a34',17);for(let i=0;i<7;i++){let an=i*Math.PI*2/7;ellipse(2+Math.cos(an)*39,-114+Math.sin(an)*22,41,12,'#3f9a54')}ctx.restore()};function flower(a,b){ellipse(a,b,12,12,'#ff92b6');for(let i=0;i<5;i++){let t=i*2*Math.PI/5;ellipse(a+Math.cos(t)*10,b+Math.sin(t)*10,8,7,'#ffb0c8')}ellipse(a,b,5,5,'#f5c747')};

function character(a,b,index=0,anim=0,direction='right'){

}
function updateHUD(){document.getElementById('hud').innerHTML='🧭 '+String(player.name).replace(/[&<>"']/g,'').slice(0,18)+' · ⭐ '+score+' mata · 🔑 '+done.filter(Boolean).length+'/3<small>Gerak: kekunci anak panah / WASD / kawalan skrin</small>';document.getElementById('missions').innerHTML='<b>Misi Pasukan</b>'+sites.map((s,i)=>'<div>'+(done[i]?'✅':i&&!done[i-1]?'🔒':'🔸')+' '+s.title+'</div>').join('');document.querySelectorAll('.location').forEach((el,i)=>{el.classList.toggle('locked',i>0&&!done[i-1]);el.textContent=(done[i]?'✅ ':i>0&&!done[i-1]?'🔒 ':'')+sites[i].title});document.getElementById('missionState').textContent=sites.map((s,i)=>(done[i]?'✅':i&&!done[i-1]?'🔒':'🔸')+' Misi '+(i+1)).join(' · ');if(done.every(Boolean))document.getElementById('notice').textContent='🏆 Tahniah! Semua tiga misi Treasure Hunt selesai!'}

document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('show');function tick(){let dx=0,dy=0;if(keys.has('ArrowLeft')||keys.has('a')||held==='left')dx--;if(keys.has('ArrowRight')||keys.has('d')||held==='right')dx++;if(keys.has('ArrowUp')||keys.has('w')||held==='up')dy--;if(keys.has('ArrowDown')||keys.has('s')||held==='down')dy++;walking=!!(dx||dy)&&!document.getElementById('modal').classList.contains('show');if(dx<0)facing='left';else if(dx>0)facing='right';else if(dy<0)facing='back';else if(dy>0)facing='front';if(walking&&!document.getElementById('modal').classList.contains('show')){let m=Math.hypot(dx,dy);x=Math.max(70,Math.min(1190,x+dx/m*4));y=Math.max(145,Math.min(625,y+dy/m*4));step+=.25;if(roomRef&&Date.now()-lastSync>110){lastSync=Date.now();roomRef.child('players/'+ownUid).update({x:Math.round(x),y:Math.round(y),facing})}}setTimeout(tick,30)}window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();keys.add(e.key);if(e.key===' '&&!document.getElementById('modal').classList.contains('show')){let i=nearest();if(i>=0)openSign(i)}});window.addEventListener('keyup',e=>keys.delete(e.key));window.addEventListener('blur',()=>{keys.clear();held=null});document.querySelectorAll('[data-dir]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();held=b.dataset.dir;b.setPointerCapture(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>held=null))});async function initMultiplayer(){const id=sessionStorage.getItem('arGeoTreasureRoom');if(!id||!window.AR_GEO_FIREBASE_CONFIG?.databaseURL)return;try{if(!window.firebase)throw Error('Tiada sambungan Firebase');firebase.initializeApp(window.AR_GEO_FIREBASE_CONFIG);const a=await firebase.auth().signInAnonymously();ownUid=a.user.uid;roomRef=firebase.database().ref('treasureRooms/'+id);const s=await roomRef.child('players/'+ownUid).once('value');if(!s.exists())throw Error('Pemain tidak berdaftar dalam pasukan');roomRef.child('players').on('value',s=>{remotePlayers=s.val()||{};document.getElementById('netStatus').textContent='Pasukan '+id+' · '+Object.keys(remotePlayers).length+'/4 pemain'});roomRef.child('progress/done').on('value',s=>{const arr=s.val()||{};for(let i=0;i<3;i++)done[i]=!!arr[i];updateHUD()});roomRef.child('players/'+ownUid).onDisconnect().remove()}catch(e){document.getElementById('netStatus').textContent='Sambungan gagal: '+e.message}}updateHUD();tick();render();initMultiplayer();
